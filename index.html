<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharkTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030812; --panel:rgba(10,22,34,.7); --panel-2:rgba(13,26,38,.75);
    --border:#16324a; --text:#ffffff; --text-dim:#9db3c4; --text-faint:#6d8ba3;
    --accent:#00e5c7; --accent-glow:rgba(0,229,199,.45);
    --danger:#ff5f3d; --danger-glow:rgba(255,95,61,.45);
    --gold:#facc15; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1000px 460px at 15% -6%, rgba(0,229,199,.14), transparent 60%),
      radial-gradient(1000px 460px at 85% 6%, rgba(0,229,199,.10), transparent 60%),
      var(--bg);
  }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:44px 20px 80px;}

  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:34px; padding-bottom:24px; border-bottom:1px solid var(--border);}
  .logo-slot{display:flex; align-items:center; gap:14px;}
  .logo-slot img{height:40px; width:auto; display:block;}
  /* Indicador de "en vivo" — igual que el sitio viejo: punto que
     pulsa + "Actualizado hace Xs/Xm", para que quede claro en stream
     que la página sigue actualizando y no se congeló. */
  .live-indicator{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); padding:6px 12px; border-radius:999px;}
  .pulse-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:live-pulse 2.2s infinite;}
  @keyframes live-pulse{0%{box-shadow:0 0 0 0 var(--accent-glow);} 70%{box-shadow:0 0 0 8px rgba(0,229,199,0);} 100%{box-shadow:0 0 0 0 rgba(0,229,199,0);}}
  @media (max-width:700px){ .live-indicator{display:none !important;} }
  footer{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .footer-logo{height:34px; width:auto;}
  h1{grid-column:2; margin:0; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(28px,4vw,40px); letter-spacing:.03em; text-transform:uppercase;
     background:linear-gradient(90deg,#fff 0%,var(--accent) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .auth-slot{grid-column:3; justify-self:end;}
  .avatar{width:40px; height:40px; border-radius:50%; background:#0a1622; border:2px solid var(--accent); box-shadow:0 0 10px var(--accent-glow); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:var(--accent); text-decoration:none;}
  /* Header: ícono de invocador del jugador con sesión iniciada */
  .avatar{overflow:hidden; transition:transform .15s, box-shadow .15s;}
  .avatar:hover{transform:scale(1.06); box-shadow:0 0 16px var(--accent-glow);}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  /* Sesión de Discord iniciada pero sin cuenta de LoL vinculada todavía */
  .avatar.pending{border-color:var(--gold); box-shadow:0 0 10px rgba(250,204,21,.4); color:var(--gold);}
  .login-btn{background:var(--accent); color:#032018; font-family:'Rajdhani',sans-serif; font-weight:700; padding:8px 18px; border-radius:8px; text-decoration:none; font-size:14px;}

  .section-title{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .section-title .bar{width:4px; height:16px; border-radius:2px; background:var(--accent); box-shadow:0 0 10px var(--accent-glow);}
  .section-title h2{margin:0; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.08em;}
  section{margin-bottom:44px;}

  /* PODIO */
  .podium-grid{display:flex; align-items:flex-end; gap:18px; margin-bottom:24px;}
  .podium-card{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:30px 14px 28px; min-height:250px; justify-content:center; position:relative; overflow:hidden;}
  .podium-card > *{position:relative; z-index:1;}
  .podium-card.rank1{flex:1.4; padding:44px 14px 40px; min-height:300px; border-color:var(--accent); background:linear-gradient(180deg, rgba(0,229,199,.16), var(--panel) 65%); box-shadow:0 0 40px var(--accent-glow), 0 0 90px rgba(0,229,199,.18);}
  /* Fondo de la tarjeta = skin elegida (o campeón en vivo si está jugando) */
  .podium-splash{position:absolute; inset:0; z-index:0; background-size:cover; background-position:center 12%;}
  .podium-scrim{position:absolute; inset:0; z-index:0; background:linear-gradient(180deg, rgba(3,8,18,.2) 0%, rgba(3,8,18,.5) 45%, rgba(3,8,18,.94) 100%);}
  .podium-rank-chip{font-size:10px; font-weight:800; padding:4px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:.1em; background:var(--panel-2); color:var(--text-faint); border:1px solid var(--border); margin-bottom:10px;}
  .podium-card.rank1 .podium-rank-chip{background:var(--accent); color:#032018; border:none;}
  /* Ícono grande de corona/medalla, con glow, además del chip de texto */
  .podium-medal{font-size:34px; line-height:1; margin-bottom:8px; filter:drop-shadow(0 0 10px var(--medal-glow, rgba(250,204,21,.7)));}
  .podium-card.rank1 .podium-medal{font-size:50px; margin-bottom:10px;}
  .podium-medal.gold{--medal-glow:rgba(250,204,21,.85);}
  .podium-medal.silver{--medal-glow:rgba(203,213,225,.8);}
  .podium-medal.bronze{--medal-glow:rgba(240,168,104,.8);}
  .podium-avatar{width:56px; height:56px; border-radius:50%; background:#0a1622; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--text-dim); margin-bottom:12px; overflow:hidden;}
  .podium-card.rank1 .podium-avatar{width:88px; height:88px; border:3px solid var(--accent); box-shadow:0 0 24px var(--accent-glow); font-size:22px; color:var(--accent);}
  .podium-avatar img{width:100%; height:100%; object-fit:cover;}
  .podium-name{font-size:14px; font-weight:800;}
  .podium-card.rank1 .podium-name{font-size:19px;}
  /* Nombre de invocador → link a su perfil (solo el nombre; el resto de la fila
     sigue abriendo el Historial Individual como antes) */
  .profile-link{color:inherit; text-decoration:none; overflow:hidden; text-overflow:ellipsis; transition:color .15s;}
  .profile-link:hover{color:var(--accent); text-decoration:underline; text-underline-offset:3px;}
  .podium-meta{font-size:11px; font-weight:600; color:var(--text-faint); text-transform:uppercase; margin:3px 0 12px;}
  .podium-lp{font-size:17px; font-weight:900; color:var(--accent);}
  .podium-card.rank1 .podium-lp{font-size:30px; background:linear-gradient(90deg,var(--gold),#fff3c4); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .podium-tier-row{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:4px;}
  .podium-tier{font-size:11px; color:var(--text-faint); font-weight:600;}

  /* TWITCH — oculto por defecto, se abre con animación cuando hay vivo */
  .twitch-wrap{display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .5s ease, opacity .4s ease, margin .5s ease; margin-bottom:0;}
  .twitch-wrap.visible{grid-template-rows:1fr; opacity:1; margin-bottom:28px;}
  .twitch-inner{min-height:0; overflow:hidden;}
  .twitch-card{width:100%; max-width:880px; margin:0 auto; display:flex; background:var(--panel); border:1px solid var(--danger-glow); box-shadow:0 0 24px rgba(255,95,61,.12); border-radius:var(--radius); overflow:hidden;}
  .twitch-preview{flex:0 0 480px; aspect-ratio:16/9; position:relative; background:repeating-linear-gradient(45deg,#0a1622,#0a1622 10px,#0d1c28 10px,#0d1c28 20px); border-right:1px solid var(--border);}
  .twitch-preview iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block;}
  .twitch-live-chip{position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; background:rgba(3,8,18,.75); padding:4px 10px; border-radius:6px;}
  .pulse-dot{width:6px; height:6px; border-radius:50%; background:var(--danger); box-shadow:0 0 6px var(--danger-glow); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,95,61,.6);} 70%{box-shadow:0 0 0 8px rgba(255,95,61,0);} 100%{box-shadow:0 0 0 0 rgba(255,95,61,0);}}
  .twitch-info{flex-grow:1; padding:22px 24px; display:flex; flex-direction:column; justify-content:center; gap:8px; min-width:0;}
  .twitch-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
  .twitch-title{font-size:19px; font-weight:800; line-height:1.25; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  /* Pantallas medianas: el video se encoge un poco; en celular, video arriba a todo el ancho y la info debajo. */
  @media (max-width:980px){ .twitch-preview{flex-basis:56%;} }
  @media (max-width:700px){
    .twitch-card{flex-direction:column;}
    .twitch-preview{flex:none; width:100%; border-right:none; border-bottom:1px solid var(--border);}
    .twitch-info{padding:14px 16px 16px; gap:5px;}
    .twitch-title{font-size:16px; -webkit-line-clamp:3;}
  }
  .twitch-game{font-size:13px; color:var(--accent); font-weight:700;}
  .twitch-viewers{font-size:13px; color:var(--danger); font-weight:700;}

  /* Tarjetas destacadas (Primera Victoria, Rey de la Temporada) */
  .spotlight-card{position:relative; overflow:hidden; display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid rgba(250,204,21,.4); box-shadow:0 0 24px rgba(250,204,21,.1); border-radius:var(--radius); padding:18px 22px; margin-bottom:28px;}
  .spotlight-badge{position:absolute; top:0; left:0; background:var(--gold); color:#000; font-size:10px; font-weight:800; padding:4px 12px; border-bottom-right-radius:8px; text-transform:uppercase; letter-spacing:.08em;}
  .spotlight-icon{width:52px; height:52px; border-radius:12px; background:rgba(250,204,21,.16); border:2px solid var(--gold); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; overflow:hidden;}
  .spotlight-icon img{width:100%; height:100%; object-fit:cover;}
  /* Antes de que alguien gane hoy — misma tarjeta, atenuada. */
  .spotlight-card.pending{border-color:var(--border); box-shadow:none; opacity:.8;}
  .spotlight-card.pending .spotlight-badge{background:var(--panel-2); color:var(--text-faint);}
  .spotlight-card.pending .spotlight-icon{background:var(--panel-2); border-color:var(--border); font-size:22px; color:var(--text-faint);}
  .spotlight-champ{width:36px; height:36px; border-radius:8px; overflow:hidden; border:1px solid var(--gold); flex-shrink:0; background:#0a1622;}
  .spotlight-champ img{width:100%; height:100%; object-fit:cover;}
  .spotlight-meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--text-faint); font-weight:600; margin-top:2px;}
  .spotlight-meta .spells{display:flex; gap:3px;}
  .spotlight-meta .spells img{width:16px; height:16px; border-radius:4px; border:1px solid var(--border); background:#0a1622;}
  /* Rey de la Temporada — mismo estilo de tarjeta que Primera Victoria,
     pero la etiqueta va como label arriba del nombre (con la corona en
     línea) en vez de listón en la esquina, y el ícono de invocador
     lleva una corona chiquita superpuesta, como se veía en el sitio
     viejo (SoloQReto). */
  .rey-avatar-wrap{position:relative; flex-shrink:0;}
  .rey-crown-badge{position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%; background:var(--bg); box-shadow:0 0 0 1px var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1;}
  .rey-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); display:flex; align-items:center; gap:5px;}

  /* Grids de tarjetas (badges recientes / destacados semana) */
  .cards-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .info-card{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
  .info-card .ico{width:44px; height:44px; border-radius:12px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .info-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
  .info-player{font-size:14px; font-weight:800; margin:2px 0;}
  .info-detail{font-size:12px; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:5px;}
  .badge-champ-icon{width:18px; height:18px; border-radius:4px; object-fit:cover; flex-shrink:0;}
  @media (max-width:700px){ .cards-grid{grid-template-columns:1fr 1fr;} }

  /* Ranking */
  .filter-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .filter-bar select{background:var(--panel-2); color:var(--text); border:1px solid var(--border); padding:7px 12px; border-radius:8px; font-family:inherit; font-size:12px; cursor:pointer;}
  .rank-head, .rank-row{display:flex; align-items:center; gap:14px;}
  .rank-head{padding:0 16px 8px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
  .rank-list{display:flex; flex-direction:column; gap:6px;}
  .rank-row{min-height:68px; padding:12px 16px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden; contain:paint; display:flex; align-items:center;}
  /* Racha — solo el icono 🔥/❄️ + un borde que "respira" alrededor de
     toda la fila. Va en un ::after propio (no en la animación de la fila)
     para no pisarse con los efectos de fila de la tienda, que usan su
     propia animación/capa. Sin partículas: así una decoración comprada
     no queda sobrecargada. */
  .rank-row.streak-fire, .rank-row.streak-ice{--streak-c:255,95,61;}
  .rank-row.streak-ice{--streak-c:125,211,252;}
  .rank-row.streak-fire{border-color:rgba(var(--streak-c),.55);}
  .rank-row.streak-ice{border-color:rgba(var(--streak-c),.5);}
  .rank-row.streak-fire::after, .rank-row.streak-ice::after{content:''; position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(var(--streak-c),.7), inset 0 0 10px rgba(var(--streak-c),.22);
    animation:streak-border 2.4s ease-in-out infinite;}
  .rank-row.streak-ice::after{animation-duration:2.8s;}
  @keyframes streak-border{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(var(--streak-c),.55), inset 0 0 8px rgba(var(--streak-c),.14);}
    50%{box-shadow:inset 0 0 0 1.5px rgba(var(--streak-c),.95), inset 0 0 16px rgba(var(--streak-c),.32);}}
  .row-content{position:relative; z-index:1; display:flex; align-items:center; gap:14px; width:100%;}
  .col-pos{width:24px; font-size:14px; font-weight:700; color:var(--text-faint); text-align:center;}
  .col-pos.pos-1{font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:800; color:var(--gold); text-shadow:0 0 10px rgba(250,204,21,.6);}
  .col-pos.pos-2{font-size:17px; text-shadow:0 0 10px rgba(203,213,225,.65);}
  .col-pos.pos-3{font-size:17px; text-shadow:0 0 10px rgba(240,168,104,.65);}
  .col-avatar{position:relative; width:44px; height:44px; flex-shrink:0;}
  .avatar-circle{width:100%; height:100%; border-radius:50%; overflow:hidden; background:#0a1622; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px;}
  /* Ícono de Twitch — hueco propio entre el nombre/racha y la franja
     del campeón (antes iba en la esquina del avatar y chocaba con los
     marcos). El hueco existe aunque no tenga Twitch, para que todo
     quede alineado. Se pone rojo cuando está en vivo. */
  .col-twitch{width:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .twitch-badge{width:18px; height:18px; display:flex; align-items:center; justify-content:center; text-decoration:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); transition:transform .15s;}
  .twitch-badge:hover{transform:scale(1.15);}
  .twitch-badge img{width:100%; height:100%; display:block;}
  .twitch-badge.live{border-radius:50%; box-shadow:0 0 0 1px var(--danger), 0 0 8px var(--danger-glow);}
  .twitch-badge.live img{filter:brightness(0) saturate(100%) invert(46%) sepia(89%) saturate(1657%) hue-rotate(325deg) brightness(103%) contrast(101%);}
  .streak-icon{font-size:13px; display:inline-block;}
  .rank-row.streak-fire .streak-icon{animation:fire-flicker 1.1s ease-in-out infinite; filter:drop-shadow(0 0 4px rgba(255,130,70,.8));}
  .rank-row.streak-ice .streak-icon{animation:ice-float 2.4s ease-in-out infinite; filter:drop-shadow(0 0 4px rgba(125,211,252,.8));}
  @keyframes fire-flicker{0%,100%{transform:scale(1) rotate(-4deg);} 50%{transform:scale(1.18) rotate(4deg);}}
  @keyframes ice-float{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-2px) rotate(8deg);}}
  .col-role{width:96px; flex-shrink:0;}
  /* Todas las píldoras del mismo ancho; la flecha tiene su propio hueco fijo
     (aunque no haya flecha) para que nada se desplace. */
  .role-pill, .role-head{display:inline-block; width:74px; text-align:center; box-sizing:border-box;}
  .role-pill{ background:rgba(0,229,199,.14); color:var(--accent); font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px;}
  .avatar-circle img{width:100%; height:100%; object-fit:cover;}
  .col-name{flex-grow:1; min-width:0; font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Campeón representativo — en vivo si está jugando, si no su campeón
     elegido. Franja de alto completo de la fila (no una cajita), corte
     diagonal, difuminada — sutil, no ocupa todo el fondo de la fila
     como hacía el splash viejo. */
  .col-champ-outer{align-self:stretch; width:64px; flex-shrink:0; margin:-12px 0; position:relative; overflow:hidden; clip-path:polygon(30% 0,100% 0,70% 100%,0 100%);}
  /* Nítido, no borroso — se oscurece con brightness bajo + un degradé
     encima, así el personaje se ve claro pero queda integrado a la
     fila (parte del fondo) en vez de robarse la atención. */
  .col-champ-outer::before{content:''; position:absolute; inset:0 -2px; background-image:var(--champbg); background-size:cover; background-position:center 18%; filter:saturate(1.05) brightness(.55);}
  .col-champ-outer::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(3,8,18,.1), rgba(3,8,18,.55) 55%, rgba(3,8,18,.82) 100%);}
  .col-champ-outer.live::after{background:linear-gradient(90deg, rgba(255,95,61,.14), rgba(3,8,18,.5) 55%, rgba(3,8,18,.78) 100%);}
  .col-estado{width:96px; display:flex; flex-direction:column; align-items:flex-start; gap:3px;}
  /* Dúo en vivo: dos+ del roster en la misma partida ahora mismo,
     mismo equipo — chip pequeño bajo "En partida", igual que hacía el
     sitio viejo con duo_con. */
  .duo-tag{font-size:10px; font-weight:700; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .champ-mini{width:20px; height:20px; border-radius:5px; overflow:hidden; flex-shrink:0; background:#0a1622; border:1px solid var(--border);}
  .champ-mini img{width:100%; height:100%; object-fit:cover;}
  .status-chip{font-size:10px; font-weight:800; padding:4px 8px; border-radius:6px; text-transform:uppercase; white-space:nowrap;}
  .status-chip.in-game{background:rgba(255,95,61,.15); color:var(--danger); border:1px solid rgba(255,95,61,.4);}
  .status-chip.offline{background:rgba(161,161,170,.1); color:#a1a1aa; border:1px solid rgba(161,161,170,.2);}
  .col-role{width:96px; flex-shrink:0; font-size:12px; color:var(--text-dim); font-weight:600; display:flex; align-items:center; gap:6px;}
  .trend-arrow{width:12px; flex-shrink:0; text-align:center; font-size:11px; font-weight:900; line-height:1;}
  .trend-arrow.up{color:var(--accent);}
  .trend-arrow.down{color:var(--danger);}
  .col-rank{width:110px; display:flex; align-items:center; gap:6px;}
  .rank-emblem{width:18px; height:18px; flex-shrink:0;}
  .col-rank .tier-lp .tier{font-size:13px; color:#fff; font-weight:700; line-height:1.2;}
  .col-rank .tier-lp .lp{font-size:11px; color:var(--accent); font-weight:700; line-height:1.2;}
  .col-wr{width:90px;}
  .wr-pct{font-size:11px; color:var(--text-faint); margin-bottom:3px;}

  /* Historial de logros */

  a.countdown-card:hover{border-color:var(--accent); box-shadow:0 0 18px rgba(0,229,199,.15);}

  /* Barrido — cuando un dato en vivo cambia (LP, rango, winrate...) se
     resalta con un brillo que cruza el elemento, sin reconstruir ni
     parpadear el resto de la fila. */
  .value-changed{position:relative; display:inline-block; animation:value-flash .9s ease;}
  .value-changed::after{content:''; position:absolute; top:0; left:-60%; width:50%; height:100%; pointer-events:none;

  @keyframes value-flash{ 0%{ filter:brightness(1);} 18%{ filter:brightness(1.6) drop-shadow(0 0 6px var(--accent-glow)); } 100%{ filter:brightness(1); } }
  @keyframes sweep-shine{ from{ left:-60%; } to{ left:130%; } }

  footer{margin-top:60px; padding-top:32px; border-top:1px solid var(--border); text-align:center; color:var(--text-dim); font-size:13px;}

<script type="module">

  mision_completada:'🎯', mision_grupal:'👥', reroll_ganado:'🎲', compra:'🛍️', canje:'🎁', insignia:'🏅',
};

let ddragonVersion = '15.19.1';
try {
  const versions = await fetch('https://ddragon.leagueoflegends.com/api/versions.json').then(r => r.json());
  ddragonVersion = versions[0];
} catch (e) { console.warn('DDragon version fetch falló, usando fallback', e); }

// Riot manda "FiddleSticks" (S mayúscula) en championName, pero el
// archivo real en Data Dragon es "Fiddlesticks.png" (s minúscula) — el
// sitio viejo ya tenía este fix (CHAMPION_ID_OVERRIDES/champKey), acá
// faltaba y rompía el ícono en toda partida de Fiddlesticks.
const CHAMPION_ID_OVERRIDES = { FiddleSticks: 'Fiddlesticks' };
const champKey = (name) => { const clean = (name || '').trim(); return CHAMPION_ID_OVERRIDES[clean] || clean; };
const champIconUrl = (champion) => `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/champion/${champKey(champion)}.png`;
// Splash "loading screen" — mismo formato/URL que ya usaba el sitio viejo
// (OLD/index.html: PODIUM_SPLASH), sin versión de parche en la ruta.
const splashUrl = (champion, skin) => `https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${champKey(champion)}_${skin ?? 0}.jpg`;
const profileIconUrl = (iconId) => iconId ? `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/profileicon/${iconId}.png` : null;
const emblemUrl = (tier) => `${MINI_CREST_BASE}${(tier || 'unranked').toLowerCase()}.png`;
const initials = (name) => (name || '?').replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2).toUpperCase();
const formatDuration = (seconds) => seconds ? `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}` : null;
// Fallback de imágenes rotas — igual que hacía el sitio viejo
// (AVATAR_ONERROR + onerror="this.style.visibility='hidden'"): si un
// ícono de invocador todavía no existe en Data Dragon (recién salió),
// cae a uno clásico; si un campeón/hechizo/runa/emblema no carga, se
// oculta en vez de mostrar el ícono roto.

// ── Header: menú del ícono de perfil (assets/auth-menu.js) ──
// Ir a perfil · Editar perfil · Mi Twitch · Admin Dashboard (admins) · Cerrar sesión
const authMenu = createAuthMenu({ supabase, profileIconUrl });
createMissionsWidget({ supabase, profileIconUrl });
const AVATAR_ONERROR = `this.onerror=null;this.src='${profileIconUrl(1)}';`;
const HIDE_ONERROR = `this.style.visibility='hidden';`;
// El orden real ya lo calcula el backend (rank_snapshots.elo_score), que sí
// tiene en cuenta la división — no se recalcula acá para no repetir mal la
// lógica (esto es justo lo que se rompió: comparar solo tier+LP ignoraba
// la división y ponía Oro III por encima de Oro II con más LP).
const timeAgo = (iso) => {
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 60) return `hace ${diffMin}min`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `hace ${diffH}h`;
  return `hace ${Math.round(diffH / 24)}d`;
};

// ── Historial Individual — catálogos de hechizos/runas de DDragon,
// se cargan una sola vez y quedan cacheados para toda la sesión.
let selectedPlayerId = null;
let nameById = new Map();
let playersById = new Map();
// Indicador de "en vivo" del header — se pisa cada vez que render()
// termina de traer datos de Supabase, igual que hacía el sitio viejo.
let lastUpdate = null;
function tickLiveIndicator() {
  const el = document.getElementById('live-indicator-text');
  if (!el) return;
  if (!lastUpdate) { el.textContent = 'Cargando…'; return; }
  const secs = Math.floor((Date.now() - lastUpdate) / 1000);
  if (secs < 5) el.textContent = 'Actualizado ahora';
  else if (secs < 60) el.textContent = `Actualizado hace ${secs}s`;
  else el.textContent = `Actualizado hace ${Math.floor(secs / 60)}m`;
}
const summonerSpellById = {};
const runeIconById = {};
let matchCatalogsPromise = null;
function loadMatchCatalogs() {
  if (matchCatalogsPromise) return matchCatalogsPromise;
  matchCatalogsPromise = Promise.all([
    fetch(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/data/es_ES/summoner.json`).then(r => r.json()),
    fetch(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/data/es_ES/runesReforged.json`).then(r => r.json()),
  ]).then(([summonerData, runesData]) => {
    Object.values(summonerData.data ?? {}).forEach(s => { summonerSpellById[Number(s.key)] = s.image.full; });
    (runesData ?? []).forEach(style => {
      runeIconById[style.id] = style.icon;
      (style.slots ?? []).forEach(slot => (slot.runes ?? []).forEach(r => { runeIconById[r.id] = r.icon; }));
    });
  }).catch(e => console.warn('catálogos de hechizos/runas fallaron', e));

}
const spellIconUrl = (id) => summonerSpellById[id] ? `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/spell/${summonerSpellById[id]}` : null;
const runeIconUrl = (perkId) => runeIconById[perkId] ? `https://ddragon.leagueoflegends.com/cdn/img/${runeIconById[perkId]}` : null;

// ── Historial reciente de TODOS los jugadores — se trae una sola vez
// por render() (no una consulta por click), y queda cacheado en memoria.
// Así cambiar de jugador en "Historial Individual" es instantáneo, y
// además alimenta el cálculo de racha 🔥/❄️ de la fila del ranking.
let historyByPlayer = new Map();   // player_id -> hasta 10 partidas recientes de SoloQ, más nuevas primero
let companionsByMatch = new Map(); // match_id -> [{team, player_id}, ...]

async function loadAllHistories(playerIds) {
  if (!playerIds.length) { historyByPlayer = new Map(); companionsByMatch = new Map(); return; }

  const { data: participaciones } = await supabase
    .from('match_participants')
    .select('*, matches!inner(match_id, duration_seconds, ended_at, queue_id)')
    .in('player_id', playerIds)
    .eq('matches.queue_id', 420)
    .order('ended_at', { foreignTable: 'matches', ascending: false })
    .limit(300);

  historyByPlayer = new Map();
  (participaciones ?? []).forEach(m => {
    const list = historyByPlayer.get(m.player_id) ?? [];
    if (list.length < 10) list.push(m);
    historyByPlayer.set(m.player_id, list);
  });

  const matchIds = [...new Set((participaciones ?? []).map(m => m.match_id))];
  const { data: companeros } = matchIds.length
    ? await supabase.from('match_participants').select('match_id, team, player_id').in('match_id', matchIds)
    : { data: [] };
  companionsByMatch = new Map();
  (companeros ?? []).forEach(c => {
    const list = companionsByMatch.get(c.match_id) ?? [];
    list.push(c);
    companionsByMatch.set(c.match_id, list);
  });
}

// Racha de 3+ victorias o derrotas seguidas, contando desde la partida
// más reciente hacia atrás — mismo criterio que usaba el sitio viejo.
// Flecha de tendencia junto al rol — YA NO es "ganaste/perdiste la
// última partida" (así era en el sitio viejo), Alex pidió cambiarlo a
// balance de victorias/derrotas en las últimas 5 de SoloQ: más
// victorias que derrotas → arriba, más derrotas que victorias → abajo.
// Con 3 partidas o menos jugadas, o empate 2-2, no hay flecha.
function getTrendArrow(id) {
  const games = (historyByPlayer.get(id) ?? []).slice(0, 5);
  if (games.length < 3) return null;
  const wins = games.filter(g => g.win).length;
  const losses = games.length - wins;
  if (wins === losses) return null;
  return wins > losses ? 'up' : 'down';
}

function getStreakType(id) {
  const games = historyByPlayer.get(id) ?? [];
  if (games.length < 3) return null;
  const primero = games[0].win;
  let racha = 0;
  for (const g of games) { if (g.win === primero) racha++; else break; }
  return racha >= 3 ? (primero ? 'fire' : 'ice') : null;
}

// Cambiar de jugador seleccionado ya no consulta la red — solo lee
// del Map que ya está en memoria y redibuja al instante.
function selectPlayer(id) {
  selectedPlayerId = id;
  renderRanking();
  renderHistoryPanel(id);
}

// Nombres de rol oficiales del sitio: TOP / JUNGLE / MID / ADC / SUPPORT.
// Acepta tanto los códigos de Riot (MIDDLE, BOTTOM, UTILITY) como los
// nombres viejos guardados en players.primary_role (Jungla, Support…).
const ROLE_NORMALIZE = {
  TOP: 'TOP', JUNGLE: 'JUNGLE', JUNGLA: 'JUNGLE', MIDDLE: 'MID', MID: 'MID',
  BOTTOM: 'ADC', ADC: 'ADC', UTILITY: 'SUPPORT', SUPPORT: 'SUPPORT',
};
const roleLabel = (r) => r ? (ROLE_NORMALIZE[String(r).trim().toUpperCase()] ?? String(r).toUpperCase()) : null;

function renderHistoryPanel(id) {
  const panel = document.getElementById('history-panel');
  const participaciones = (historyByPlayer.get(id) ?? []).slice(0, 5);

  if (participaciones.length === 0) {
    const nombre = nameById.get(id) ?? 'Este jugador';
    panel.innerHTML = `<p class="empty">${nombre} todavía no tiene partidas de SoloQ registradas.</p>`;
    return;
  }

  const matchesHtml = participaciones.map(m => {
    const duoNames = (companionsByMatch.get(m.match_id) ?? [])
      .filter(c => c.team === m.team && c.player_id !== id && nameById.has(c.player_id))
      .map(c => nameById.get(c.player_id));

    const spellsHtml = (m.summoner_spells ?? [])
      .map(sid => { const url = spellIconUrl(sid); return url ? `<img src="${url}" alt="" onerror="${HIDE_ONERROR}">` : ''; })
      .join('');

    const keystoneUrl = runeIconUrl(m.keystone_perk);
    const secundariaUrl = runeIconUrl(m.secondary_style);
    const runesHtml = (keystoneUrl || secundariaUrl) ? `
      <span class="match-runes">
        ${keystoneUrl ? `<img src="${keystoneUrl}" alt="" onerror="${HIDE_ONERROR}">` : ''}
        ${secundariaUrl ? `<img src="${secundariaUrl}" alt="" onerror="${HIDE_ONERROR}">` : ''}
      </span>` : '';

    // Remake = partida terminada en menos de 5 minutos (misma convención que el sitio viejo).
    const resultado = !m.win && m.matches.duration_seconds < 300 ? 'remake' : (m.win ? 'victoria' : 'derrota');
    const kda = `${m.kills ?? 0}/${m.deaths ?? 0}/${m.assists ?? 0}`;
    const egidaHtml = m.extra_stats?.posible_egida
      ? `<span class="egida-tag" title="Ganaste bastante más LP de lo normal en esta partida — probablemente Égida de Valor (LP doble por autocompletado). Es una estimación, Riot no lo confirma directamente."><img src="assets/Aegis_of_Valor_icon.svg" alt="">Égida de Valor</span>`
      : '';
    // ¿Autofill? — jugó un rol distinto a su rol principal (Riot no lo confirma).
    const rolPrincipal = roleLabel(playersById.get(id)?.primary_role);
    const rolPartida = roleLabel(m.role);
    const autofillHtml = resultado !== 'remake' && rolPartida && rolPrincipal && rolPartida !== rolPrincipal
      ? `<span class="autofill-tag" title="Jugó ${rolPartida} y su rol principal es ${rolPrincipal}. Pudo haber sido autofill — es una estimación, Riot no lo confirma.">¿Autofill?</span>`
      : '';

    return `
      <a class="match" href="partidas.html?id=${encodeURIComponent(m.match_id)}&jugador=${encodeURIComponent(id)}" title="Ver la partida completa">
        <span class="match-icons">
          <img class="champ-icon" src="${champIconUrl(m.champion)}" alt="" onerror="${HIDE_ONERROR}">
          ${spellsHtml ? `<span class="match-spells">${spellsHtml}</span>` : ''}
          ${runesHtml}
        </span>
        <span>
          <div class="match-champ">${m.champion}</div>
          <div class="match-kda">${kda} KDA</div>
          ${duoNames.length ? `<div class="match-duo">🎮 Dúo con ${duoNames.join(', ')}</div>` : ''}
        </span>
        <span class="match-result-block">
          <span class="result-chip ${resultado}">${resultado === 'victoria' ? 'Victoria' : resultado === 'remake' ? 'Remake' : 'Derrota'}</span>
          ${(m.lp_change ?? null) !== null
            ? `<span class="lp-change ${m.lp_change >= 0 ? 'win' : 'loss'}">${m.lp_change >= 0 ? '+' : ''}${m.lp_change} LP</span>`
            : (formatDuration(m.matches.duration_seconds) ? `<span class="lp-change" style="color:var(--text-faint);font-weight:600;">${formatDuration(m.matches.duration_seconds)}</span>` : '')}
          ${autofillHtml}
          ${egidaHtml}
        </span>
      </a>`;
  }).join('');

  panel.innerHTML = `<div class="matches">${matchesHtml}</div>`;
}

// ── Filtro de elo: se arma una sola vez ──────────────────────────
const filterSelect = document.getElementById('elo-filter');
TIER_ORDER.slice().reverse().forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = TIER_LABEL[t];
  filterSelect.appendChild(opt);
});

let roster = [];
// Últimos valores mostrados por jugador — para saber si un dato cambió
// y animarlo con el barrido, y para no redibujar filas que no cambiaron.
let rowSweepFields = new Map();
let podiumSweepFields = new Map();

// Arma el HTML de una fila del ranking y calcula su "firma" (todo lo que
// se ve). Si la firma es igual a la de la fila que ya está en el DOM, esa
// fila ni se toca — así una fila cambiando no hace parpadear a las demás.
function buildRow(p, idx) {
  const streakType = getStreakType(p.id); // 'fire' | 'ice' | null
  const streakEmoji = streakType === 'fire' ? '🔥' : streakType === 'ice' ? '❄️' : '';
  const streakTitle = streakType === 'fire' ? 'Racha de victorias' : streakType === 'ice' ? 'Racha de derrotas' : '';
  const enPartida = p.live?.in_game;
  const duoCon = p.live?.duo_con ?? [];
  const wr = p.rank && (p.rank.wins + p.rank.losses) > 0 ? Math.round(p.rank.wins / (p.rank.wins + p.rank.losses) * 100) : null;
  const trend = getTrendArrow(p.id);
  const trendHtml = trend
    ? `<span class="trend-arrow ${trend}" title="${trend === 'up' ? 'Más victorias que derrotas en sus últimas 5' : 'Más derrotas que victorias en sus últimas 5'}">${trend === 'up' ? '▲' : '▼'}</span>` : '<span class="trend-arrow"></span>';

  // Top 3 con corona/medalla (con glow) reemplazando el número — el
  // resto de las posiciones muestra el número normal.
  const posClass = idx === 0 ? 'pos-1' : idx === 1 ? 'pos-2' : idx === 2 ? 'pos-3' : '';
  const posContent = idx === 0 ? '👑' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);

  // Campeón representativo: en vivo si está jugando, si no su
  // "representación" elegida (players.favorite_champion). Ya no cubre
  // toda la fila (eso se sacó) — es solo la franja angosta y difuminada
  // de .col-champ-outer, entre el nombre y la columna de Estado.
  // Campeón/skin elegidos en su perfil, o los que venían cargados por defecto.
  const favChamp = p.profile?.favorite_champion || p.favorite_champion;
  const favSkin = p.profile?.favorite_champion ? (p.profile.favorite_skin ?? 0) : (p.favorite_skin ?? 0);
  const champBg = enPartida ? p.live.champion : favChamp;
  const skinBg = enPartida ? 0 : favSkin;

  const iconUrl = profileIconUrl(p.icon_id);
  const avatarHtml = iconUrl ? `<img src="${iconUrl}" alt="" onerror="${AVATAR_ONERROR}">` : initials(p.riot_game_name);
  const twitchLive = !!p.stream?.is_live;
  const twitchBadgeHtml = p.profile.twitch_username
    ? `<a class="twitch-badge ${twitchLive ? 'live' : ''}" href="https://twitch.tv/${encodeURIComponent(p.profile.twitch_username)}" target="_blank" rel="noopener" title="Twitch${twitchLive ? ' en vivo' : ''}" onclick="event.stopPropagation()"><img src="assets/${twitchLive ? 'Online_Twitch' : 'Offline_Twitch'}.svg" alt="Twitch"></a>`
    : '';
  const tierText = p.rank ? (TIER_LABEL[p.rank.tier] ?? p.rank.tier) + ' ' + (p.rank.division ?? '') : 'Unranked';
  const lpText = `${p.rank?.lp ?? 0} LP`;

  const cos = equippedMap.get(p.id) ?? null;
  const row = document.createElement('div');
  row.dataset.playerId = p.id;
  row.className = `rank-row ${p.id === selectedPlayerId ? 'active' : ''} ${streakType ? 'streak-' + streakType : ''}`;
  row.addEventListener('click', () => selectPlayer(p.id));
  row.innerHTML = `
    <div class="row-content">
      <div class="col-pos ${posClass}">${posContent}</div>
      <div class="col-avatar"><div class="avatar-circle">${avatarHtml}</div></div>
      <div class="col-name"><a class="profile-link" href="perfil.html?jugador=${encodeURIComponent(p.id)}" title="Ver perfil de ${p.riot_game_name}" onclick="event.stopPropagation()">${nameHtml(p.riot_game_name, cos)}</a>${streakEmoji ? ` <span class="streak-icon" title="${streakTitle}">${streakEmoji}</span>` : ''}</div>
      <div class="col-twitch">${twitchBadgeHtml}</div>
      <div class="col-champ-outer ${enPartida ? 'live' : ''}" ${champBg ? `style="--champbg:url('${splashUrl(champBg, skinBg)}')"` : ''}></div>
      <div class="col-estado">
        <span class="status-chip ${enPartida ? 'in-game' : 'offline'}">${enPartida ? 'En partida' : 'Offline'}</span>
        ${enPartida && duoCon.length ? `<span class="duo-tag" title="Dúo con ${duoCon.join(', ')}">🎮 con ${duoCon.join(', ')}</span>` : ''}
      </div>
      <div class="col-role">${trendHtml}${p.primary_role ? `<span class="role-pill">${roleLabel(p.primary_role)}</span>` : '<span class="role-head">—</span>'}</div>
      <div class="col-rank">
        <img class="rank-emblem" src="${emblemUrl(p.rank?.tier)}" alt="" onerror="${HIDE_ONERROR}">
        <div class="tier-lp"><div class="tier">${tierText}</div><div class="lp">${lpText}</div></div>
      </div>
      <div class="col-wr">
        ${wr !== null ? `<div class="wr-pct">${wr}%</div><div class="wr-bar"><div class="wr-fill" style="width:${wr}%"></div></div>` : ''}
      </div>
    </div>`;

  row.dataset.signature = JSON.stringify([
    p.id === selectedPlayerId, streakType, posContent, champBg, skinBg,
    avatarHtml, twitchLive, enPartida, duoCon, trend, roleLabel(p.primary_role), tierText, lpText, wr,
    cos?.marco, cos?.fila, cos?.nombre, cos?.nombre_valor, cos?.emoji,
  ]);
  // Cosméticos de la tienda: efecto de fila + marco alrededor del avatar
  applyRowEffect(row, cos?.fila);
  decorateAvatar(row.querySelector('.avatar-circle'), cos?.marco, 44, cos?.marcoItem);

  // Barrido — si el LP, el rango o el winrate cambiaron desde el último
  // render de este jugador, se resalta solo ese dato puntual.
  const prev = rowSweepFields.get(p.id);
  if (prev) {
    if (prev.lpText !== lpText) row.querySelector('.lp')?.classList.add('value-changed');
    if (prev.tierText !== tierText) row.querySelector('.tier')?.classList.add('value-changed');
    if (wr !== null && prev.wr !== wr) row.querySelector('.wr-pct')?.classList.add('value-changed');
  }
  rowSweepFields.set(p.id, { lpText, tierText, wr });

  return row;
}

function renderRanking() {
  const filtro = filterSelect.value;
  const listEl = document.getElementById('ranking-list');
  const visible = roster.filter(p => filtro === 'ALL' || (p.rank?.tier ?? '').toUpperCase() === filtro);

  const existingIds = Array.from(listEl.children).map(el => el.dataset.playerId);
  const visibleIds = visible.map(p => p.id);
  const sameSet = existingIds.length === visibleIds.length && existingIds.every((id, i) => id === visibleIds[i]);

  if (!sameSet) {
    // Cambió el filtro, o cambió el orden/quién está en el top — no hay
    // forma barata de parchear eso, se reconstruye la lista completa.
    listEl.innerHTML = '';
    visible.forEach((p, idx) => listEl.appendChild(buildRow(p, idx)));
    return;
  }

  // Mismo set y mismo orden que ya está en pantalla: cada fila se compara
  // contra su versión anterior, y solo se reemplaza (y anima) la que
  // realmente cambió — el resto ni se toca, cero parpadeo.
  visible.forEach((p, idx) => {
    const existing = listEl.children[idx];
    const fresh = buildRow(p, idx);
    if (existing.dataset.signature !== fresh.dataset.signature) {
      existing.replaceWith(fresh);
    }
  });
}
filterSelect.addEventListener('change', renderRanking);

function renderBadgeCard(container, categoria, badgeByCategory, nameById) {
  const meta = BADGE_META[categoria];
  if (!meta) return;
  const b = badgeByCategory.get(categoria);
  const div = document.createElement('div');
  div.className = 'info-card';
  if (b) {
    // Empate inclusivo (issue 4 de KNOWN_ISSUES2.md): si varios
    // jugadores llegaron al mismo máximo, se listan todos los nombres
    // unidos con " & " — igual que namesJoined() del sitio viejo.
    const ids = (b.player_ids && b.player_ids.length) ? b.player_ids : [b.player_id];
    const nombres = ids.map(id => nameById.get(id) ?? '?').join(' & ');
    const champHtml = b.champion
      ? `<img class="badge-champ-icon" src="${champIconUrl(b.champion)}" alt="${b.champion}" onerror="${HIDE_ONERROR}">` : '';
    div.innerHTML = `
      <div class="ico">${meta.icono}</div>
      <div style="min-width:0;">
        <div class="info-label">${meta.label}</div>
        <div class="info-player">${nombres}</div>
        <div class="info-detail">${champHtml}<span>${b.detail ?? ''}</span></div>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="ico">${meta.icono}</div>
      <div style="min-width:0;">
        <div class="info-label">${meta.label}</div>
        <div class="info-detail" style="color:var(--text-faint);font-weight:600;">${meta.empty ?? 'Sin datos todavía.'}</div>
      </div>`;
  }
  container.appendChild(div);
}

// ── Carga + dibuja TODO — se vuelve a llamar cada vez que Realtime
// avisa que algo cambió en las tablas suscritas (ver más abajo).
async function render() {
  const [{ data: players }, { data: profiles }, { data: rankSnaps }, { data: liveStatus },
         { data: streamStatus }, { data: weeklyBadges }, { data: events }, { data: firstWin }] = await Promise.all([
    supabase.from('players').select('*'),
    supabase.from('player_profiles').select('*'),
    supabase.from('rank_snapshots').select('*').eq('queue_type', 'RANKED_SOLO_5x5').order('recorded_at', { ascending: false }),
    supabase.from('live_status').select('*'),
    supabase.from('stream_status').select('*'),
    supabase.from('weekly_badges').select('*'),
    supabase.from('events').select('*').order('occurred_at', { ascending: false }).limit(20),
    supabase.from('daily_first_win_state').select('*').maybeSingle(),
  ]);
  loadRetoCountdown();
  try { equippedMap = await loadEquipped(supabase); } catch { equippedMap = new Map(); }

  const profileByPlayer = new Map((profiles ?? []).map(p => [p.player_id, p]));
  const liveByPlayer = new Map((liveStatus ?? []).map(l => [l.player_id, l]));
  const streamByPlayer = new Map((streamStatus ?? []).map(s => [s.player_id, s]));
  const badgeByCategory = new Map((weeklyBadges ?? []).map(b => [b.category, b]));
  nameById = new Map((players ?? []).map(p => [p.id, p.riot_game_name]));
  playersById = new Map((players ?? []).map(p => [p.id, p]));

  // Dúo en vivo: si dos o más del roster están AHORA MISMO en la misma
  // partida (mismo game_id) y del mismo equipo, se muestran como dúo
  // en el chip de estado (igual que hacía el sitio viejo con
  // liveStatus.duo_con — acá se calcula solo, live_status no trae ese
  // campo armado, pero sí trae game_id y team, que alcanza).
  const liveDuoByPlayer = new Map();
  {
    const byGame = new Map();
    for (const l of liveStatus ?? []) {
      if (!l.in_game || !l.game_id) continue;
      const list = byGame.get(l.game_id) ?? [];
      list.push(l);
      byGame.set(l.game_id, list);
    }
    for (const list of byGame.values()) {
      if (list.length < 2) continue;
      for (const l of list) {
        const companions = list
          .filter(o => o.player_id !== l.player_id && (o.team == null || l.team == null || o.team === l.team))
          .map(o => nameById.get(o.player_id))
          .filter(Boolean);
        if (companions.length) liveDuoByPlayer.set(l.player_id, companions);
      }
    }
  }

  const latestRankByPlayer = new Map();
  for (const row of rankSnaps ?? []) {
    if (!latestRankByPlayer.has(row.player_id)) latestRankByPlayer.set(row.player_id, row);
  }

  roster = (players ?? []).map(p => ({
    ...p,
    profile: profileByPlayer.get(p.id) ?? {},
    live: { ...(liveByPlayer.get(p.id) ?? { in_game: false }), duo_con: liveDuoByPlayer.get(p.id) ?? [] },
    stream: streamByPlayer.get(p.id) ?? { is_live: false },
    rank: latestRankByPlayer.get(p.id) ?? null,
  })).sort((a, b) => (b.rank?.elo_score ?? -1) - (a.rank?.elo_score ?? -1));

  // Historial reciente de todos los jugadores (para el panel individual
  // y para calcular la racha 🔥/❄️) — una sola vez acá, no por click.
  await Promise.all([loadMatchCatalogs(), loadAllHistories(roster.map(p => p.id))]);

  // Header: sesión actual
  const { data: { session } } = await supabase.auth.getSession();
  authMenu.render(session, players ?? [], profiles ?? []);

  // Podio (top 3)
  const podiumEl = document.getElementById('podium');
  podiumEl.innerHTML = '';
  [1, 0, 2].forEach((idx) => { // #2, #1, #3 visualmente
    const p = roster[idx];
    if (!p) return;
    const rankNum = idx + 1;
    const div = document.createElement('div');
    div.className = `podium-card ${rankNum === 1 ? 'rank1' : ''}`;
    // Fondo del podio = SIEMPRE la skin elegida (favorite_champion/skin).
    // El swap a campeón en vivo solo pasa en la fila del ranking, no aquí.
    const champBg = p.profile?.favorite_champion || p.favorite_champion;
    const skinBg = p.profile?.favorite_champion ? (p.profile.favorite_skin ?? 0) : (p.favorite_skin ?? 0);
    const splashHtml = champBg
      ? `<div class="podium-splash" style="background-image:url('${splashUrl(champBg, skinBg)}')"></div><div class="podium-scrim"></div>`
      : '';
    // Avatar = ícono de invocador REAL (players.icon_id), no el campeón.
    const iconUrl = profileIconUrl(p.icon_id);
    const avatarHtml = iconUrl ? `<img src="${iconUrl}" alt="" onerror="${AVATAR_ONERROR}">` : initials(p.riot_game_name);
    const medalIcon = rankNum === 1 ? '👑' : rankNum === 2 ? '🥈' : '🥉';
    const medalClass = rankNum === 1 ? 'gold' : rankNum === 2 ? 'silver' : 'bronze';
    const tierText = p.rank ? (TIER_LABEL[p.rank.tier] ?? p.rank.tier) + ' ' + (p.rank.division ?? '') : 'Unranked';
    const lpText = `${p.rank?.lp ?? 0} LP`;
    // Barrido — si el LP/rango de este jugador cambió desde el último
    // render, se resalta al insertar la tarjeta (el podio son solo 3
    // tarjetas, reconstruirlas entero no es el problema de fondo).
    const prevPodium = podiumSweepFields.get(p.id);
    const lpChanged = prevPodium && prevPodium.lpText !== lpText;
    const tierChanged = prevPodium && prevPodium.tierText !== tierText;
    podiumSweepFields.set(p.id, { lpText, tierText });
    div.innerHTML = `
      ${splashHtml}
      <div class="podium-medal ${medalClass}">${medalIcon}</div>
      <div class="podium-rank-chip">${rankNum === 1 ? '👑 #1' : '#' + rankNum}</div>
      <div class="podium-avatar">${avatarHtml}</div>
      <div class="podium-name"><a class="profile-link" href="perfil.html?jugador=${encodeURIComponent(p.id)}" title="Ver perfil de ${p.riot_game_name}">${p.riot_game_name}</a></div>
      <div class="podium-meta">${roleLabel(p.primary_role) ?? 'Sin datos'}</div>
      <div class="podium-lp ${lpChanged ? 'value-changed' : ''}">${lpText}</div>
      <div class="podium-tier-row">
        <img class="rank-emblem" src="${emblemUrl(p.rank?.tier)}" alt="" onerror="${HIDE_ONERROR}">
        <div class="podium-tier ${tierChanged ? 'value-changed' : ''}">${tierText}</div>
      </div>`;
    podiumEl.appendChild(div);
  });

  // Twitch — se abre o se colapsa según quién esté en vivo ahora.
  // El iframe solo se crea cuando cambia el canal: cada minuto llega una
  // actualización (viewers, título…) y recrearlo reiniciaba el video.
  const twitchWrap = document.getElementById('twitch-wrap');
  const liveStreamer = roster.find(p => p.stream?.is_live && p.profile?.twitch_username);
  if (liveStreamer) {
    const card = document.getElementById('twitch-card');
    const channel = liveStreamer.profile.twitch_username;
    if (card.dataset.channel !== channel) {
      const parentDomain = window.location.hostname || 'localhost';
      card.innerHTML = `
      <div class="twitch-preview">
        <div class="twitch-live-chip"><span class="pulse-dot"></span><span style="font-size:10px;font-weight:800;color:#fff;text-transform:uppercase;">En vivo</span></div>
        <iframe src="https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${parentDomain}&muted=true" allowfullscreen></iframe>
      </div>
      <div class="twitch-info">
        <div class="twitch-label"></div>
        <div class="twitch-title"></div>
        <div class="twitch-game"></div>
        <div class="twitch-viewers"></div>
      </div>`;
      card.dataset.channel = channel;
    }
    card.querySelector('.twitch-label').textContent = channel;
    card.querySelector('.twitch-title').textContent = liveStreamer.stream.title ?? '';
    card.querySelector('.twitch-game').textContent = liveStreamer.stream.game_name ?? '';
    card.querySelector('.twitch-viewers').textContent = `${liveStreamer.stream.viewer_count ?? 0} viewers`;
    requestAnimationFrame(() => twitchWrap.classList.add('visible'));
  } else {
    twitchWrap.classList.remove('visible');
    const card = document.getElementById('twitch-card');
    // Al terminar el directo se quita el reproductor (deja de cargar video).
    setTimeout(() => { if (!twitchWrap.classList.contains('visible')) { card.innerHTML = ''; delete card.dataset.channel; } }, 600);
  }

  // Primera Victoria del Día — foto real, campeón, KDA, hechizos, lado
  // y duración (antes solo mostraba iniciales y nombre). Ahora la
  // sección siempre se muestra: si todavía nadie ganó hoy, se ve una
  // versión atenuada en vez de ocultarse por completo.
  const pvSection = document.getElementById('primera-victoria-section');
  const p = firstWin?.player_id ? roster.find(r => r.id === firstWin.player_id) : null;
  if (p) {
    const pvIconUrl = profileIconUrl(p.icon_id);
    const pvAvatarHtml = pvIconUrl ? `<img src="${pvIconUrl}" alt="" onerror="${AVATAR_ONERROR}">` : initials(p.riot_game_name);
    const pvChampHtml = firstWin.champion
      ? `<div class="spotlight-champ"><img src="${champIconUrl(firstWin.champion)}" alt="${firstWin.champion}" onerror="${HIDE_ONERROR}"></div>` : '';
    const pvKda = firstWin.kills != null ? `${firstWin.kills}/${firstWin.deaths}/${firstWin.assists} KDA` : null;
    const pvSpellsHtml = (firstWin.summoner_spells ?? [])
      .map(sid => { const url = spellIconUrl(sid); return url ? `<img src="${url}" alt="" onerror="${HIDE_ONERROR}">` : ''; }).join('');
    const pvLado = firstWin.team === 'blue' ? 'Equipo Azul' : firstWin.team === 'red' ? 'Equipo Rojo' : null;
    const pvDuracion = formatDuration(firstWin.duration_seconds);

    document.getElementById('primera-victoria').innerHTML = `
      <div class="spotlight-card">
        <div class="spotlight-badge">Primera Victoria del Día</div>
        <div class="spotlight-icon" style="margin-top:8px;">${pvAvatarHtml}</div>
        ${pvChampHtml}
        <div style="margin-top:8px;min-width:0;">
          <div style="font-size:17px;font-weight:800;">${p.riot_game_name}</div>
          <div class="spotlight-meta">
            ${firstWin.champion ? `<span>${firstWin.champion}</span>` : ''}
            ${pvKda ? `<span>${pvKda}</span>` : ''}
            ${pvSpellsHtml ? `<span class="spells">${pvSpellsHtml}</span>` : ''}
            ${pvLado ? `<span>${pvLado}</span>` : ''}
            ${pvDuracion ? `<span>${pvDuracion}</span>` : ''}
          </div>
        </div>
        <div style="margin-top:8px;margin-left:auto;font-size:12px;color:var(--gold);font-weight:800;">
          ${new Date(firstWin.won_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
        </div>
      </div>`;
  } else {
    document.getElementById('primera-victoria').innerHTML = `
      <div class="spotlight-card pending">
        <div class="spotlight-badge">Primera Victoria del Día</div>
        <div class="spotlight-icon" style="margin-top:8px;">🌅</div>
        <div style="margin-top:8px;font-size:13px;color:var(--text-faint);font-weight:600;">Nadie ha ganado hoy todavía.</div>
      </div>`;
  }

  // Badges últimas 10 + destacados semana
  const badgesRecientesEl = document.getElementById('badges-recientes');
  const destacadosEl = document.getElementById('destacados-semana');
  badgesRecientesEl.innerHTML = '';
  destacadosEl.innerHTML = '';
  ['top_asesino', 'sin_rendirse', 'top_observador'].forEach(c => renderBadgeCard(badgesRecientesEl, c, badgeByCategory, nameById));
  ['otp_del_torneo', 'escalador', 'horas_en_la_grieta', 'agresivo', 'kda_player', 'champion_pool',
   'tortuga', 'asistente', 'pentakills', 'duo_dinamico', 'farmeador', 'defensor', 'ladron', 'destructor', 'stop']
    .forEach(c => renderBadgeCard(destacadosEl, c, badgeByCategory, nameById));

  // Rey de la Temporada — mismo formato que el sitio viejo: ícono real
  // de invocador con coronita superpuesta, nombre completo (con tag) y
  // el detalle de días acumulados en el Top 1.
  const reySection = document.getElementById('rey-temporada-section');
  const rey = badgeByCategory.get('rey_temporada');
  if (rey) {
    reySection.style.display = '';
    const reyPlayer = playersById.get(rey.player_id);
    const reyIconUrl = profileIconUrl(reyPlayer?.icon_id);
    const reyAvatarHtml = reyIconUrl ? `<img src="${reyIconUrl}" alt="" onerror="${AVATAR_ONERROR}">` : initials(reyPlayer?.riot_game_name ?? nameById.get(rey.player_id) ?? '?');
    const reyNombre = reyPlayer
      ? `${reyPlayer.riot_game_name}${reyPlayer.riot_tag_line ? `#${reyPlayer.riot_tag_line}` : ''}`
      : (nameById.get(rey.player_id) ?? '?');
    document.getElementById('rey-temporada').innerHTML = `
      <div class="spotlight-card">
        <div class="rey-avatar-wrap">
          <div class="spotlight-icon">${reyAvatarHtml}</div>
          <div class="rey-crown-badge">👑</div>
        </div>
        <div style="min-width:0;flex-grow:1;">
          <div class="rey-label"><span>👑</span>Rey de la Temporada</div>
          <div style="font-size:15px;font-weight:800;margin-top:3px;">${reyNombre}</div>
          <div style="font-size:12px;color:var(--gold);font-weight:700;margin-top:2px;">${rey.detail ?? ''}</div>
        </div>
      </div>`;
  } else {
    reySection.style.display = 'none';
  }

  // Historial Individual — mantiene la selección si el jugador sigue
  // en el roster, si no elige al primero (mismo criterio que el sitio viejo).
  // selectPlayer() ya se encarga de llamar a renderRanking().
  if (roster.length) {
    const sigueValido = roster.some(p => p.id === selectedPlayerId);
    selectPlayer(sigueValido ? selectedPlayerId : roster[0].id);
  } else {
    selectedPlayerId = null;
    renderRanking();
  }

  // Historial de Logros
  const logrosEl = document.getElementById('logros');
  logrosEl.innerHTML = '';
  if (!events || events.length === 0) {
    logrosEl.innerHTML = `<div class="empty">Todavía no hay logros registrados.</div>`;
  } else {
    events.forEach(ev => {
      const icono = EVENT_META[ev.type] ?? '🔔';
      const nombreNuevo = nameById.get(ev.player_id) ?? '?';
      const nombreAnterior = ev.previous_player_id ? nameById.get(ev.previous_player_id) : null;
      let texto = '';
      if (ev.type === 'badge_semanal' || ev.type === 'badge_reciente') texto = `<b>${nombreNuevo}</b> reclamó ${BADGE_META[ev.category]?.label ?? ev.category}` + (nombreAnterior ? ` (se lo quitó a <b>${nombreAnterior}</b>)` : '');
      else if (ev.type === 'record_lp') texto = `<b>${nombreNuevo}</b> alcanzó un nuevo récord de temporada`;
      else if (ev.type === 'adelantamiento') texto = `<b>${nombreNuevo}</b> superó a <b>${nombreAnterior}</b>`;
      else if (ev.type === 'rey_temporada') texto = `<b>${nombreNuevo}</b> es el nuevo Rey de la Temporada` + (nombreAnterior ? ` (se lo quitó a <b>${nombreAnterior}</b>)` : '');
      else if (ev.type === 'primera_victoria_dia') texto = `<b>${nombreNuevo}</b> consiguió la primera victoria del día`;
      else if (ev.type === 'reto_ganado') texto = `<b>${nombreNuevo}</b> ganó el reto`;
      else if (ev.type === 'mision_completada') texto = `<b>${nombreNuevo}</b> completó una misión ${({ easy: 'fácil', medium: 'media', hard: 'difícil' })[ev.category] ?? ''}`;
      else if (ev.type === 'mision_grupal') texto = `El grupo completó la misión grupal`;
      else if (ev.type === 'reroll_ganado') texto = `<b>${nombreNuevo}</b> ganó un reroll 🎲`;
      else if (ev.type === 'compra') texto = `<b>${nombreNuevo}</b> se compró algo en la tienda 🛍️`;
      else if (ev.type === 'canje') texto = `<b>${nombreNuevo}</b> canjeó un premio 🎁`;
      else if (ev.type === 'insignia') texto = `<b>${nombreNuevo}</b> consiguió una insignia`;
      else if (ev.type === 'posible_egida') texto = `<b>${nombreNuevo}</b> posible Égida de Valor`;
      else if (ev.category?.startsWith('perfecta:')) texto = `<b>${nombreNuevo}</b> logró Partida Perfecta`;
      else if (ev.category?.startsWith('ace:')) texto = `<b>${nombreNuevo}</b> logró Ace Perfecto`;
      else if (ev.category?.startsWith('terminador:')) texto = `<b>${nombreNuevo}</b> le dio el golpe final al Nexus`;
      else texto = `<b>${nombreNuevo}</b> — ${ev.category ?? ev.type}`;

      const item = document.createElement('div');
      item.className = 'logro-item';
      const iconoHtml = icono.endsWith('.svg') ? `<img src="${icono}" alt="" onerror="${HIDE_ONERROR}">` : icono;
      item.innerHTML = `
        <div class="logro-icon">${iconoHtml}</div>
        <div style="flex:1;min-width:0;">
          <div class="logro-text">${texto}</div>
          ${ev.detail ? `<div class="logro-detail">${['reto_ganado', 'mision_completada', 'mision_grupal', 'reroll_ganado', 'compra', 'canje', 'insignia'].includes(ev.type) ? String(ev.detail).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`) : ev.detail}</div>` : ''}
        </div>
        <div class="logro-time">${timeAgo(ev.occurred_at)}</div>`;
      logrosEl.appendChild(item);
    });
  }

  lastUpdate = Date.now();
  tickLiveIndicator();
}

await render();

// ── Cuenta regresiva — fija, no depende de datos de Supabase.
// Convierte hora "de pared" en Madrid a UTC real (mismo patrón que
// offsetMadridMinutos() en supabase/functions/sync-matches), así no
// hay que adivinar a mano el offset CET/CEST.
function madridWallToUTC(year, month, day, hour = 0, minute = 0) {
  const approx = new Date(Date.UTC(year, month - 1, day, hour, minute));
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Madrid', timeZoneName: 'shortOffset' }).formatToParts(approx);
  const offsetStr = parts.find(p => p.type === 'timeZoneName')?.value ?? 'GMT+1';
  const offsetH = parseInt(offsetStr.replace('GMT', '')) || 1;
  return new Date(Date.UTC(year, month - 1, day, hour - offsetH, minute));
}

// Fin del split: sin fecha oficial de Riot todavía — placeholder
// acordado con KyoSumi, actualizar cuando Riot confirme la real.

// El reto sale de la base (se crea en el Admin Dashboard): en curso →
// cuenta hasta su final; programado → cuenta hasta que empieza; si no
// hay ninguno abierto, muestra al ganador del último reto terminado.
var countdownSig; // var: se usa antes de esta línea (ver buildCountdowns)
function buildCountdowns(reto) {
  // Se arma acá adentro: render() (más arriba) puede llamar a esto antes de que
  // el script llegue a esta parte del archivo.
  const list = [{ label: 'Fin del Split', target: madridWallToUTC(2027, 1, 1) }];
  const escHtml = (t) => String(t ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  if (reto?.open) {
    const live = new Date(reto.open.starts_at).getTime() <= Date.now();
    list.push({ label: `${live ? 'Final de' : 'Empieza'} ${escHtml(reto.open.name)}`,
                target: new Date(live ? reto.open.ends_at : reto.open.starts_at), href: `reto.html?id=${reto.open.id}` });
  }
  const sig = JSON.stringify([list.map(c => [c.label, c.target.getTime()]), reto?.lastWinner ?? null]);
  if (sig === countdownSig) return;
  countdownSig = sig;
  const grid = document.getElementById('countdown-grid');
  const winnerCard = !reto?.open && reto?.lastWinner ? `
    <a class="countdown-card reto-winner-card" href="reto.html?id=${reto.lastWinner.id}">
      <div class="countdown-label">🏆 Ganador de ${escHtml(reto.lastWinner.name)}</div>
      <div class="reto-winner-name">${escHtml(reto.lastWinner.player)}</div>
      <div class="reto-winner-link">Ver resultados →</div>
    </a>` : '';
  grid.innerHTML = list.map((c) => `
    <${c.href ? `a href="${c.href}"` : 'div'} class="countdown-card${c.href ? ' is-link' : ''}" data-target-ms="${c.target.getTime()}">
      <div class="countdown-label">${c.label}</div>
      <div class="countdown-digits">
        <div class="cd-unit"><span class="cd-value" data-unit="d">--</span><span class="cd-caption">días</span></div>
        <div class="cd-unit"><span class="cd-value" data-unit="h">--</span><span class="cd-caption">hs</span></div>
        <div class="cd-unit"><span class="cd-value" data-unit="m">--</span><span class="cd-caption">min</span></div>
        <div class="cd-unit"><span class="cd-value" data-unit="s">--</span><span class="cd-caption">seg</span></div>
      </div>
    </${c.href ? 'a' : 'div'}>`).join('') + winnerCard;
  grid.style.gridTemplateColumns = grid.children.length === 1 ? '1fr' : '';
  tickCountdowns();
}

function tickCountdowns() {
  document.querySelectorAll('.countdown-card[data-target-ms]').forEach((card) => {
    const targetMs = Number(card.dataset.targetMs);
    const diff = Math.max(0, targetMs - Date.now());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff / 3600000) % 24;
    const mins = Math.floor(diff / 60000) % 60;
    const secs = Math.floor(diff / 1000) % 60;
    card.querySelector('[data-unit="d"]').textContent = days;
    card.querySelector('[data-unit="h"]').textContent = String(hours).padStart(2, '0');
    card.querySelector('[data-unit="m"]').textContent = String(mins).padStart(2, '0');
    card.querySelector('[data-unit="s"]').textContent = String(secs).padStart(2, '0');
    card.classList.toggle('finished', diff === 0);
  });
}

async function loadRetoCountdown() {
  const [{ data: open }, { data: last }] = await Promise.all([
    supabase.from('challenges').select('id, name, starts_at, ends_at').is('finished_at', null).order('starts_at', { ascending: true }).limit(1),
    supabase.from('challenges').select('id, name, finished_at').not('finished_at', 'is', null).order('finished_at', { ascending: false }).limit(1),
  ]);
  let lastWinner = null;
  if (last?.[0]) {
    const { data: w } = await supabase.from('challenge_results').select('riot_game_name, display_name')
      .eq('challenge_id', last[0].id).eq('position', 1).maybeSingle();
    if (w) lastWinner = { id: last[0].id, name: last[0].name, player: w.display_name || w.riot_game_name };
  }
  buildCountdowns({ open: open?.[0] ?? null, lastWinner });
}
if (!countdownSig) buildCountdowns(null); // si el reto ya cargó, no se pisa
setInterval(tickCountdowns, 1000);
setInterval(tickLiveIndicator, 1000);

// ── Realtime — Supabase avisa al instante cuando cambia algo en
// estas tablas; se agrupan avisos que lleguen muy seguidos (p.ej.
// varios rangos actualizándose en la misma corrida) en un solo
// redibujado, en vez de redibujar varias veces en el mismo segundo.
let rerenderTimer = null;
// Partida del mes (la mejor de SoloQ del grupo en el mes, Fase 5).
const partidaMes = renderMatchOfMonth(document.getElementById('partida-mes'), { supabase });
let pmTimer = null;

function scheduleRerender() {
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(render, 600);
}

supabase.channel('sharktracker-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'player_profiles' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'rank_snapshots' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'live_status' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'stream_status' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'weekly_badges' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'challenges' }, scheduleRerender)
  // matches/match_participants: sin esto, el Historial Individual y la
  // racha 🔥/❄️ solo se refrescaban "de rebote" cuando el mismo sync
  // tocaba rank_snapshots también. Con esto quedan cubiertos aparte.
  .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'match_participants' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'player_cosmetics' }, scheduleRerender)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'best_matches' }, () => { clearTimeout(pmTimer); pmTimer = setTimeout(partidaMes.reload, 800); })
  .subscribe();
</script>
