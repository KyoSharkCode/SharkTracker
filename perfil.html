<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — SharkTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030812; --panel:rgba(10,22,34,.7); --panel-2:rgba(13,26,38,.75);
    --border:#16324a; --text:#ffffff; --text-dim:#9db3c4; --text-faint:#6d8ba3;
    --accent:#00e5c7; --accent-glow:rgba(0,229,199,.45);
    --danger:#ff5f3d; --danger-glow:rgba(255,95,61,.45);
    --gold:#facc15; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1000px 460px at 15% -6%, rgba(0,229,199,.14), transparent 60%),
      radial-gradient(1000px 460px at 85% 6%, rgba(0,229,199,.10), transparent 60%),
      var(--bg);
  }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:44px 20px 80px;}

  /* ── HEADER (igual que index.html) ── */
  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:24px; border-bottom:1px solid var(--border);}
  .logo-slot{display:flex; align-items:center; gap:14px;}
  .logo-slot img{height:40px; width:auto; display:block;}
  .live-indicator{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); padding:6px 12px; border-radius:999px;}
  .pulse-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:live-pulse 2.2s infinite;}
  @keyframes live-pulse{0%{box-shadow:0 0 0 0 var(--accent-glow);} 70%{box-shadow:0 0 0 8px rgba(0,229,199,0);} 100%{box-shadow:0 0 0 0 rgba(0,229,199,0);}}
  @media (max-width:700px){ .live-indicator{display:none !important;} }
  header h1{grid-column:2; margin:0; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(24px,4vw,34px); letter-spacing:.03em; text-transform:uppercase;
     background:linear-gradient(90deg,#fff 0%,var(--accent) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .auth-slot{grid-column:3; justify-self:end;}
  .avatar{width:40px; height:40px; border-radius:50%; background:#0a1622; border:2px solid var(--accent); box-shadow:0 0 10px var(--accent-glow); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:var(--accent); text-decoration:none;}
  .login-btn{background:var(--accent); color:#032018; font-family:'Rajdhani',sans-serif; font-weight:700; padding:8px 18px; border-radius:8px; text-decoration:none; font-size:14px;}

  .breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-faint); margin:18px 0 24px;}
  .breadcrumb a{color:var(--accent); text-decoration:none; font-weight:700;}
  .breadcrumb a:hover{text-decoration:underline;}

  .section-title{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .section-title .bar{width:4px; height:16px; border-radius:2px; background:var(--accent); box-shadow:0 0 10px var(--accent-glow);}
  .section-title h2{margin:0; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.08em;}
  section{margin-bottom:40px;}

  #error-msg{text-align:center; padding:60px 20px; color:var(--danger); font-weight:700; display:none;}

  /* ── FILA SUPERIOR: banner (izq) + tags destacados (der) ── */
  .hero-row{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; margin-bottom:22px; align-items:stretch;}
  @media (max-width:820px){ .hero-row{grid-template-columns:1fr;} }

  .hero-banner{position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--accent); min-height:380px; background:var(--panel); box-shadow:0 0 34px var(--accent-glow), 0 0 70px rgba(0,229,199,.14);}
  .hero-splash{position:absolute; inset:0; background-size:cover; background-position:center 18%;}
  .hero-overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,8,18,0) 45%, rgba(3,8,18,.55) 70%, rgba(3,8,18,.95) 100%);}
  .hero-position{position:absolute; top:14px; right:14px; z-index:2; font-size:11px; font-weight:800; padding:6px 14px; border-radius:99px; background:rgba(3,8,18,.78); border:1px solid var(--border); color:var(--text-dim); backdrop-filter:blur(6px);}
  .hero-position:empty{display:none;}
  .hero-content{position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:18px 20px 20px; flex-wrap:wrap;}

  .hero-identity{display:flex; align-items:center; gap:14px; min-width:0; background:rgba(3,8,18,.72); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:10px 18px 10px 10px; backdrop-filter:blur(6px);}
  .hero-avatar-wrap{position:relative; flex-shrink:0;}
  .hero-avatar{width:64px; height:64px; border-radius:14px; border:2px solid var(--accent); object-fit:cover; display:block; box-shadow:0 0 14px var(--accent-glow); background:#0a1622;}
  /* Mismo criterio que index.html: sin círculo de fondo, solo el anillo rojo cuando está en vivo */
  .hero-twitch{position:absolute; bottom:-4px; right:-4px; width:20px; height:20px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  .hero-twitch img{width:100%; height:100%; display:block;}
  .hero-twitch.live{border-radius:50%; box-shadow:0 0 0 1px var(--danger), 0 0 8px var(--danger-glow);}
  .hero-twitch.live img{filter:brightness(0) saturate(100%) invert(46%) sepia(89%) saturate(1657%) hue-rotate(325deg) brightness(103%) contrast(101%);}
  .hero-name-block{min-width:0;}
  .p-name{margin:0; font-family:'Rajdhani',sans-serif; font-weight:800; font-size:clamp(20px,3vw,28px); line-height:1.1; letter-spacing:.03em; text-transform:uppercase; color:#fff; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .p-tag{font-family:'Inter',sans-serif; font-size:12px; color:var(--text-faint); font-weight:600; text-transform:none; letter-spacing:0;}
  .trend-arrow{font-size:13px; font-weight:900; cursor:default;}
  .trend-arrow.up{color:var(--accent);}
  .trend-arrow.down{color:var(--danger);}
  .streak-icon{font-size:15px;}
  .p-role{margin:4px 0 0; font-size:12px; color:var(--text-dim); font-weight:600;}

  .hero-rank{display:flex; flex-direction:column; align-items:flex-end; gap:4px; background:rgba(3,8,18,.72); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:10px 18px; backdrop-filter:blur(6px);}
  .hero-tier-row{display:flex; align-items:center; gap:8px;}
  .hero-tier-row img{width:26px; height:26px; object-fit:contain;}
  .hero-tier-row span{font-size:13px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.08em;}
  .hero-lp{font-family:'Rajdhani',sans-serif; font-size:34px; font-weight:800; line-height:1; white-space:nowrap; background:linear-gradient(90deg, var(--gold), #fff3c4); -webkit-background-clip:text; background-clip:text; color:transparent;}

  @media (max-width:560px){ .hero-content{flex-direction:column; align-items:stretch;} .hero-rank{align-items:flex-start;} }

  /* ── TAGS DESTACADOS (columna derecha) ── */
  .tags-col{display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:16px; min-height:0; max-height:380px;}
  @media (max-width:820px){ .tags-col{max-height:none;} }
  .tags-title{display:flex; align-items:center; gap:10px; margin:0 0 12px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);}
  .tags-title::before{content:''; width:4px; height:14px; border-radius:2px; background:var(--accent); box-shadow:0 0 8px var(--accent-glow);}
  .tags-list{display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
  .tags-list::-webkit-scrollbar{width:8px;}
  .tags-list::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  .tags-empty{font-size:12px; color:var(--text-faint); text-align:center; padding:20px 6px;}
  .tag-card{display:flex; align-items:center; gap:12px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .tag-card .ico{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.04); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .tag-card.gold{border-color:rgba(250,204,21,.45); box-shadow:0 0 14px rgba(250,204,21,.08);}
  .tag-card.gold .ico{background:rgba(250,204,21,.14);}
  .tag-card.warn{border-color:rgba(255,95,61,.4);}
  .tag-card.warn .ico{background:rgba(255,95,61,.12);}
  .tag-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:#fff;}
  .tag-detail{font-size:11px; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:5px; margin-top:2px;}
  .tag-card.warn .tag-detail{color:var(--danger);}
  .tag-card.gold .tag-detail{color:var(--gold);}
  .tag-champ-icon{width:15px; height:15px; border-radius:4px; object-fit:cover; flex-shrink:0;}

  /* ── CUADRO DE STREAM — solo existe si está en vivo (misma lógica que index.html) ── */
  .twitch-wrap{display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .5s ease, opacity .4s ease, margin .5s ease; margin-bottom:0;}
  .twitch-wrap.visible{grid-template-rows:1fr; opacity:1; margin-bottom:22px;}
  .twitch-inner{min-height:0; overflow:hidden;}
  .twitch-card{display:flex; height:220px; background:var(--panel); border:1px solid var(--danger-glow); box-shadow:0 0 24px rgba(255,95,61,.12); border-radius:var(--radius); overflow:hidden;}
  .twitch-preview{flex:0 0 57%; position:relative; background:repeating-linear-gradient(45deg,#0a1622,#0a1622 10px,#0d1c28 10px,#0d1c28 20px); border-right:1px solid var(--border);}
  .twitch-preview iframe{width:100%; height:100%; border:0;}
  .twitch-live-chip{position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; background:rgba(3,8,18,.75); padding:4px 10px; border-radius:6px;}
  .twitch-live-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--danger); box-shadow:0 0 6px var(--danger-glow); animation:pulse-red 2s infinite;}
  @keyframes pulse-red{0%{box-shadow:0 0 0 0 rgba(255,95,61,.6);} 70%{box-shadow:0 0 0 8px rgba(255,95,61,0);} 100%{box-shadow:0 0 0 0 rgba(255,95,61,0);}}
  .twitch-info{flex-grow:1; padding:22px 24px; display:flex; flex-direction:column; justify-content:center; gap:8px; min-width:0;}
  .twitch-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
  .twitch-title{font-size:18px; font-weight:800; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
  .twitch-game{font-size:13px; color:var(--accent); font-weight:700;}
  .twitch-viewers{font-size:13px; color:var(--danger); font-weight:700;}
  @media (max-width:700px){ .twitch-card{flex-direction:column; height:auto;} .twitch-preview{flex:none; aspect-ratio:16/9; border-right:none; border-bottom:1px solid var(--border);} }

  /* ── ESTADO DE PARTIDA — siempre visible ── */
  .live-status-box{position:relative; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; min-height:76px; display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .live-status-box.offline .live-offline-text{color:var(--text-dim); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.1em; opacity:.65;}
  .live-status-box.in-game{align-items:flex-start; justify-content:flex-start; border-color:var(--danger); box-shadow:0 0 26px rgba(255,95,61,.22), 0 0 0 1px rgba(255,95,61,.35) inset;}
  .live-corner-badge{position:absolute; top:0; left:0; background:var(--danger); color:#fff; font-weight:800; font-size:11px; padding:5px 12px; border-top-left-radius:var(--radius); border-bottom-right-radius:10px; text-transform:uppercase; letter-spacing:.08em;}
  .live-game-content{display:flex; flex-direction:column; width:100%; gap:14px; padding-top:10px;}
  .live-game-top{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .live-game-champ{display:flex; align-items:center; gap:10px;}
  .live-game-champ img{width:46px; height:46px; border-radius:10px; border:2px solid var(--accent); object-fit:cover; background:#0a1622;}
  .live-game-champ span{font-weight:800; font-size:16px; color:#fff;}
  .live-game-top-right{display:flex; align-items:center; gap:10px;}
  .live-game-spells{display:flex; gap:6px;}
  .live-game-spells img{width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:#0a1622;}
  .live-game-runes{display:flex; flex-direction:column; gap:4px;}
  .live-game-runes img{width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:#0a0a0c; object-fit:contain; padding:1px;}
  .live-game-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .live-game-duration{font-weight:800; font-size:12px; font-variant-numeric:tabular-nums; color:var(--gold); background:rgba(250,204,21,.12); border:1px solid rgba(250,204,21,.3); padding:6px 12px; border-radius:8px;}
  .live-game-mode{font-weight:700; font-size:11px; padding:6px 12px; border-radius:8px; background:rgba(0,229,199,.12); border:1px solid rgba(0,229,199,.3); color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
  .live-game-side{font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:6px 12px; border-radius:8px;}
  .live-game-side.side-blue{color:#60a5fa; background:rgba(96,165,250,.12); border:1px solid rgba(96,165,250,.3);}
  .live-game-side.side-red{color:#f87171; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.3);}
  .live-game-duo-box{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:rgba(0,229,199,.08); border:1px solid rgba(0,229,199,.3); border-radius:12px; padding:10px 14px;}
  .live-game-duo-label{font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); white-space:nowrap;}
  .live-game-duo-player{display:flex; align-items:center; gap:8px; flex:1; min-width:180px;}
  .live-game-duo-player img{width:32px; height:32px; border-radius:8px; border:2px solid var(--accent); object-fit:cover; background:#0a1622;}
  .live-game-duo-info{display:flex; flex-direction:column; line-height:1.3;}
  .live-game-duo-name{font-weight:800; font-size:13px; color:#fff;}
  .live-game-duo-champ{font-weight:600; font-size:11px; color:var(--text-dim);}

  /* ── STATS GRID ── */
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; margin-bottom:40px;}
  .stat-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .stat-card h3{margin:0 0 16px 0; font-size:13px; text-transform:uppercase; color:var(--text-faint); font-weight:700; border-bottom:1px solid var(--border); padding-bottom:10px; display:flex; align-items:center; gap:10px; font-family:'Rajdhani',sans-serif; letter-spacing:.04em;}
  .stat-card h3::before{content:''; width:4px; height:14px; border-radius:2px; flex-shrink:0; background:var(--accent); box-shadow:0 0 8px var(--accent-glow);}
  .list-item{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .list-item:last-child{margin-bottom:0;}
  .champ-img{width:38px; height:38px; border-radius:8px; object-fit:cover; background:#0a1622;}
  .role-ico{display:flex; align-items:center; justify-content:center; background:rgba(0,229,199,.14); color:var(--accent); font-weight:bold; font-size:18px;}
  .item-title{font-weight:700; font-size:13px;}
  .item-sub{font-size:11px; color:var(--text-dim);}

  /* ── HISTORIAL con pestañas por cola ── */
  .history-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .history-head .section-title{margin-bottom:0;}
  .queue-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .queue-tab{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; padding:6px 14px; border-radius:99px; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; gap:6px; transition:background .2s, color .2s, border-color .2s;}
  .queue-tab:hover{border-color:var(--accent); color:#fff;}
  .queue-tab.active{background:var(--accent); color:#032018; border-color:var(--accent); box-shadow:0 0 12px var(--accent-glow);}
  .queue-tab .count{font-family:'Inter',sans-serif; font-size:10px; font-weight:800; opacity:.75;}
  .history-panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
  .matches{display:flex; flex-direction:column; gap:8px;}
  .match{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--border); text-decoration:none; color:inherit;}
  .match-icons{display:flex; align-items:center; gap:5px;}
  .match .champ-icon{width:36px; height:36px; border-radius:8px; object-fit:cover; background:#0a1622; flex-shrink:0;}
  .match-spells{display:flex; flex-direction:column; gap:3px;}
  .match-spells img{width:16px; height:16px; border-radius:4px; border:1px solid var(--border); background:#0a1622;}
  .match-runes{display:flex; flex-direction:column; gap:3px;}
  .match-runes img{width:16px; height:16px; border-radius:50%; border:1px solid var(--border); background:#0a1622; object-fit:contain; padding:1px;}
  .match-champ{font-size:13px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .match-mode{font-size:10px; font-weight:700; color:var(--text-faint); background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:99px; padding:1px 8px; text-transform:uppercase; letter-spacing:.04em;}
  .match-kda{font-size:12px; color:var(--text-faint);}
  .match-duo{font-size:11px; font-weight:700; color:var(--accent); margin-top:2px;}
  .match-result-block{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .result-chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; text-align:center;}
  .result-chip.victoria{color:var(--accent); background:rgba(0,229,199,.14);}
  .result-chip.derrota{color:var(--danger); background:rgba(255,95,61,.14);}
  .result-chip.remake{color:var(--text-faint); background:rgba(161,161,170,.1);}
  .lp-change{font-size:11px; font-weight:800;}
  .lp-change.win{color:var(--accent);}
  .lp-change.loss{color:var(--danger);}
  .lp-change.dur{color:var(--text-faint); font-weight:600;}
  .egida-tag{font-size:10px; font-weight:700; color:var(--text-dim); background:rgba(255,255,255,.08); border:1px dashed rgba(255,255,255,.35); border-radius:99px; padding:2px 8px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .egida-tag img{width:12px; height:12px; object-fit:contain;}
  .empty{padding:24px; text-align:center; color:var(--text-faint); font-size:13px; margin:0;}

  /* ── GRÁFICA LP ── */
  .lp-chart-wrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 20px 14px;}
  .lp-chart-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .lp-chart-header .lp-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
  .lp-chart-header .lp-delta{font-size:13px; font-weight:800;}
  .lp-chart-header .lp-delta.up{color:var(--accent);}
  .lp-chart-header .lp-delta.down{color:var(--danger);}
  .lp-chart-header .lp-delta.flat{color:var(--text-faint);}
  #lp-canvas{display:block; width:100%; height:90px;}
  .lp-chart-footer{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-top:6px;}

  /* ── BOTÓN DE IA (abajo a la izquierda) + panel ── */
  .ai-fab{position:fixed; left:22px; bottom:22px; z-index:50; display:flex; align-items:center; gap:8px; padding:12px 18px; border-radius:99px; border:1px solid var(--accent); background:rgba(3,8,18,.92); color:var(--accent); font-family:'Rajdhani',sans-serif; font-weight:800; font-size:15px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; box-shadow:0 0 18px var(--accent-glow); backdrop-filter:blur(6px); transition:transform .2s, box-shadow .2s;}
  .ai-fab:hover{transform:translateY(-2px); box-shadow:0 0 28px var(--accent-glow);}

  .ai-body h4:first-child{margin-top:0;}

  .ai-champ{display:flex; align-items:center; gap:10px; margin-bottom:8px;}

  footer{margin-top:60px; padding-top:32px; border-top:1px solid var(--border); text-align:center; color:var(--text-dim); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:10px;}

<body>
<div class="wrap">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://mvupiohecvoiwuxwjdrt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dXBpb2hlY3ZvaXd1eHdqZHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDI1NTcsImV4cCI6MjEwNTU3ODU1N30.6vNCdX63tpyGnGII15Mjznq7BwhafH9KmnI-Os2SO4M';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIER_LABEL = {IRON:'Hierro',BRONZE:'Bronce',SILVER:'Plata',GOLD:'Oro',PLATINUM:'Platino',EMERALD:'Esmeralda',DIAMOND:'Diamante',MASTER:'Maestro',GRANDMASTER:'Gran Maestro',CHALLENGER:'Aspirante'};
const MINI_CREST_BASE = 'https://raw.communitydragon.org/14.10/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-mini-crests/';

// Badges que calcula el backend (weekly_badges). Mismo diccionario que index.html.
const BADGE_META = {
  top_asesino:{icono:'⚔️',label:'Top Asesino'}, top_observador:{icono:'👁️',label:'Top Observador'},
  sin_rendirse:{icono:'🎮',label:'Sin Rendirse'}, otp_del_torneo:{icono:'🎯',label:'OTP del Torneo'},
  escalador:{icono:'📈',label:'El Escalador'}, horas_en_la_grieta:{icono:'⏱️',label:'Horas en la Grieta'},
  agresivo:{icono:'🩸',label:'Agresivo'}, kda_player:{icono:'📊',label:'KDA Player'},
  pentakills:{icono:'💀',label:'Pentakills'}, tortuga:{icono:'🐢',label:'El Tortuga'},
  asistente:{icono:'🤝',label:'El Asistente'}, duo_dinamico:{icono:'🎮',label:'Dúo Dinámico'},
  farmeador:{icono:'🌾',label:'El Farmeador'}, defensor:{icono:'🛡️',label:'El Defensor'},
  ladron:{icono:'🥷',label:'El Ladrón'}, destructor:{icono:'💥',label:'El Destructor'},
  stop:{icono:'🛑',label:'Stop'}, champion_pool:{icono:'🎭',label:'Maestro del Champion Pool'},
};

// Pestañas del historial — agrupadas por queue_id (mismo mapeo que QUEUE_NAMES
// de las Edge Functions). Todo lo que no sea SoloQ/Flex/Reclutamiento cae en
// "Otros": Partida Rápida, ARAM, Arena, Clash y modos temporales/destacados.
const QUEUE_TABS = [
  { key:'soloq', label:'SoloQ' },
  { key:'flex', label:'Flex' },
  { key:'reclutamiento', label:'Reclutamiento' },
  { key:'otros', label:'Otros' },
];
const queueGroup = (queueId) => queueId === 420 ? 'soloq' : queueId === 440 ? 'flex' : queueId === 400 ? 'reclutamiento' : 'otros';
const HISTORY_PER_TAB = 10;

let ddragonVersion = '15.19.1';
try {
  const versions = await fetch('https://ddragon.leagueoflegends.com/api/versions.json').then(r => r.json());
  ddragonVersion = versions[0];
} catch (e) { console.warn('DDragon version fetch falló, usando fallback', e); }

const CHAMPION_ID_OVERRIDES = { FiddleSticks: 'Fiddlesticks' };
const champKey = (name) => { const clean = (name || '').trim(); return CHAMPION_ID_OVERRIDES[clean] || clean; };
const champIconUrl = (champion) => `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/champion/${champKey(champion)}.png`;
const splashUrl = (champion, skin) => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champKey(champion)}_${skin ?? 0}.jpg`;
const profileIconUrl = (iconId) => iconId ? `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/profileicon/${iconId}.png` : null;
const emblemUrl = (tier) => `${MINI_CREST_BASE}${(tier || 'unranked').toLowerCase()}.png`;
const formatDuration = (seconds) => seconds ? `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}` : null;
const HIDE_ONERROR = `this.style.visibility='hidden';`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const summonerSpellById = {};
const runeIconById = {};
let matchCatalogsPromise = null;
function loadMatchCatalogs() {
  if (matchCatalogsPromise) return matchCatalogsPromise;
  matchCatalogsPromise = Promise.all([
    fetch(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/data/es_ES/summoner.json`).then(r => r.json()),
    fetch(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/data/es_ES/runesReforged.json`).then(r => r.json()),
  ]).then(([summonerData, runesData]) => {
    Object.values(summonerData.data ?? {}).forEach(s => { summonerSpellById[Number(s.key)] = s.image.full; });
    (runesData ?? []).forEach(style => {
      runeIconById[style.id] = style.icon;
      (style.slots ?? []).forEach(slot => (slot.runes ?? []).forEach(r => { runeIconById[r.id] = r.icon; }));
    });
  }).catch(e => console.warn('catálogos de hechizos/runas fallaron', e));
  return matchCatalogsPromise;
}
const spellIconUrl = (id) => summonerSpellById[id] ? `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/spell/${summonerSpellById[id]}` : null;
const runeIconUrl = (perkId) => runeIconById[perkId] ? `https://ddragon.leagueoflegends.com/cdn/img/${runeIconById[perkId]}` : null;

// ── Jugador: acepta el UUID (players.id) o el nombre de invocador tal cual.
// Ej: perfil.html?jugador=Galactic%20Shark
const jugadorParam = new URLSearchParams(location.search).get('jugador');

let lastUpdate = null;
function tickLiveIndicator() {
  const el = document.getElementById('live-indicator-text');
  if (!el) return;
  if (!lastUpdate) { el.textContent = 'Cargando…'; return; }
  const secs = Math.floor((Date.now() - lastUpdate) / 1000);
  if (secs < 5) el.textContent = 'Actualizado ahora';
  else if (secs < 60) el.textContent = `Actualizado hace ${secs}s`;
  else el.textContent = `Actualizado hace ${Math.floor(secs / 60)}m`;
}

let liveGameStartTime = null;
function tickLiveGameDuration() {
  const el = document.getElementById('live-game-duration');
  if (!el || !liveGameStartTime) return;
  const secs = Math.max(0, Math.floor((Date.now() - liveGameStartTime) / 1000));
  el.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}

function showError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = msg;
  err.style.display = 'block';
  document.getElementById('profile-content').style.display = 'none';
}

// Estado del historial — se guarda para poder cambiar de pestaña sin volver a pedir datos.
let historyState = { byTab: new Map(), companionsByMatch: new Map(), nameById: new Map(), playerId: null };
let currentTab = 'soloq';
let lastStreamChannel = null;
let aiState = { playerId: null, latestMatchId: null, loading: false };

if (!jugadorParam) {
  showError('Falta el jugador — la URL necesita ?jugador=<nombre o id>.');
} else {
  init();
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  document.getElementById('auth-slot').innerHTML = session
    ? `<a class="avatar" href="perfil.html">…</a>`
    : `<a class="login-btn" href="login.html">Login</a>`;

  await refreshAll();
  setupAiButton();
  setInterval(tickLiveIndicator, 1000);
  setInterval(tickLiveGameDuration, 1000);

  // Realtime — sin polling: Supabase avisa cuando cambia algo, y se agrupan
  // avisos muy seguidos en un solo redibujado (mismo criterio que index.html).
  let refreshTimer = null;
  const scheduleRefresh = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshAll, 600); };
  const channel = supabase.channel('perfil-live');
  ['players', 'player_profiles', 'rank_snapshots', 'live_status', 'stream_status', 'weekly_badges',
   'matches', 'match_participants', 'player_masteries', 'daily_first_win_state']
    .forEach(table => channel.on('postgres_changes', { event: '*', schema: 'public', table }, scheduleRefresh));
  channel.subscribe();
}

async function refreshAll() {
  try {
    await loadAll();
    lastUpdate = Date.now();
    tickLiveIndicator();
  } catch (e) {
    console.error('Error cargando el perfil', e);
  }
}

async function loadAll() {
  const [{ data: players }, { data: profiles }, { data: rankSnaps }, { data: liveStatus },
         { data: streamStatus }, { data: weeklyBadges }, { data: firstWin }] = await Promise.all([
    supabase.from('players').select('*'),
    supabase.from('player_profiles').select('*'),
    supabase.from('rank_snapshots').select('*').eq('queue_type', 'RANKED_SOLO_5x5').order('recorded_at', { ascending: false }),
    supabase.from('live_status').select('*'),
    supabase.from('stream_status').select('*'),
    supabase.from('weekly_badges').select('*'),
    supabase.from('daily_first_win_state').select('*').maybeSingle(),
  ]);

  const nameById = new Map((players ?? []).map(p => [p.id, p.riot_game_name]));
  const player = (players ?? []).find(p => p.id === jugadorParam)
    ?? (players ?? []).find(p => (p.riot_game_name || '').toLowerCase() === jugadorParam.toLowerCase());
  if (!player) { showError('Jugador no encontrado.'); return; }

  document.getElementById('profile-content').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('breadcrumb-name').textContent = ` /  ${player.riot_game_name}`;
  document.title = `${player.riot_game_name} — SharkTracker`;

  const profile = (profiles ?? []).find(pr => pr.player_id === player.id) ?? {};
  const latestRankByPlayer = new Map();
  for (const row of rankSnaps ?? []) { if (!latestRankByPlayer.has(row.player_id)) latestRankByPlayer.set(row.player_id, row); }
  const rank = latestRankByPlayer.get(player.id) ?? null;
  const live = (liveStatus ?? []).find(l => l.player_id === player.id) ?? { in_game: false };
  const stream = (streamStatus ?? []).find(s => s.player_id === player.id) ?? { is_live: false };

  // Posición en el ranking (mismo orden que index.html: elo_score desc).
  // Solo cuenta si el jugador tiene rango de SoloQ.
  const sorted = (players ?? [])
    .map(p => ({ id: p.id, score: latestRankByPlayer.get(p.id)?.elo_score ?? -1 }))
    .sort((a, b) => b.score - a.score);
  const position = rank ? sorted.findIndex(p => p.id === player.id) + 1 : null;

  // Todas las partidas del jugador (todas las colas — la base guarda 30 días),
  // ordenadas en el cliente por fecha de fin, más nuevas primero.
  const [{ data: masteries }, { data: partsRaw }] = await Promise.all([
    supabase.from('player_masteries').select('*').eq('player_id', player.id).order('rank'),
    supabase.from('match_participants')
      .select('*, matches!inner(match_id, duration_seconds, ended_at, queue_id, queue_type)')
      .eq('player_id', player.id)
      .limit(500),
  ]);
  const todas = (partsRaw ?? [])
    .filter(m => m.matches)
    .sort((a, b) => new Date(b.matches.ended_at) - new Date(a.matches.ended_at));
  const soloq = todas.filter(m => m.matches.queue_id === 420);

  const byTab = new Map(QUEUE_TABS.map(t => [t.key, []]));
  todas.forEach(m => byTab.get(queueGroup(m.matches.queue_id)).push(m));

  // Compañeros del roster en esas partidas (para "Dúo con").
  const visibles = [...byTab.values()].flatMap(list => list.slice(0, HISTORY_PER_TAB));
  const matchIds = [...new Set(visibles.map(m => m.match_id))];
  const { data: companeros } = matchIds.length
    ? await supabase.from('match_participants').select('match_id, team, player_id').in('match_id', matchIds)
    : { data: [] };
  const companionsByMatch = new Map();
  (companeros ?? []).forEach(c => {
    const list = companionsByMatch.get(c.match_id) ?? [];
    list.push(c);
    companionsByMatch.set(c.match_id, list);
  });

  await loadMatchCatalogs();

  historyState = { byTab, companionsByMatch, nameById, playerId: player.id };
  // Para el botón de IA: la partida de SoloQ más reciente (sin remakes) —
  // mismo criterio que usa la Edge Function para decidir si regenerar.
  aiState.playerId = player.id;
  aiState.latestMatchId = soloq.find(m => !esRemake(m))?.match_id ?? null;

  renderHero(player, profile, rank, live, stream, position, soloq);
  renderTags(player, rank, position, soloq, weeklyBadges ?? [], firstWin, nameById);
  renderStream(profile, stream);
  await renderLiveBox(live, liveStatus ?? [], nameById);
  renderMastery(masteries ?? []);
  renderTopChamps(soloq);
  renderRoles(soloq);
  renderTabs();
  renderHistory();
  await renderLpChart(player.id);
}

// ── Cálculos sobre el historial de SoloQ ──
const esRemake = (m) => !m.win && (m.matches?.duration_seconds ?? 0) < 300;

// Flecha junto al nombre: balance de las últimas 10 de SoloQ.
// Más victorias → ▲ verde, más derrotas → ▼ roja, empate → sin flecha.
function getTrend(soloq) {
  const ultimas = soloq.filter(m => !esRemake(m)).slice(0, 10);
  if (ultimas.length < 3) return null;
  const wins = ultimas.filter(g => g.win).length;
  const losses = ultimas.length - wins;
  if (wins === losses) return null;
  return { dir: wins > losses ? 'up' : 'down', wins, losses };
}

// Racha: 3+ seguidas iguales al inicio del historial de SoloQ.
function getStreak(soloq) {
  const games = soloq.filter(m => !esRemake(m));
  if (games.length < 3) return null;
  const primero = games[0].win;
  let racha = 0;
  for (const g of games) { if (g.win === primero) racha++; else break; }
  return racha >= 3 ? { tipo: primero ? 'fire' : 'ice', n: racha } : null;
}

function renderHero(player, profile, rank, live, stream, position, soloq) {
  document.getElementById('p-position').textContent = position ? `#${position} en el Ranking` : '';

  const pAvatar = document.getElementById('p-avatar');
  pAvatar.src = profileIconUrl(player.icon_id) ?? profileIconUrl(1);
  pAvatar.onerror = () => { pAvatar.onerror = null; pAvatar.src = profileIconUrl(1); };

  const twitchLive = !!stream?.is_live;
  const twitchEl = document.getElementById('p-twitch');
  if (profile.twitch_username) {
    twitchEl.style.display = 'block';
    twitchEl.className = `hero-twitch ${twitchLive ? 'live' : ''}`;
    twitchEl.href = `https://twitch.tv/${encodeURIComponent(profile.twitch_username)}`;
    twitchEl.title = `Twitch${twitchLive ? ' — en vivo' : ''}`;
    twitchEl.querySelector('img').src = `assets/${twitchLive ? 'Online_Twitch' : 'Offline_Twitch'}.svg`;
  } else {
    twitchEl.style.display = 'none';
  }

  const trend = getTrend(soloq);
  const streak = getStreak(soloq);
  const trendHtml = trend
    ? `<span class="trend-arrow ${trend.dir}" title="Últimas ${trend.wins + trend.losses} de SoloQ: ${trend.wins}V / ${trend.losses}D">${trend.dir === 'up' ? '▲' : '▼'}</span>` : '';
  const streakHtml = streak
    ? `<span class="streak-icon" title="Racha de ${streak.n} ${streak.tipo === 'fire' ? 'victorias' : 'derrotas'}">${streak.tipo === 'fire' ? '🔥' : '❄️'}</span>` : '';
  const tag = player.riot_tag_line ? `<span class="p-tag">#${esc(player.riot_tag_line)}</span>` : '';
  document.getElementById('p-name').innerHTML = `${esc(player.riot_game_name)}${tag}${trendHtml}${streakHtml}`;
  document.getElementById('p-role').textContent = player.primary_role ? `Rol principal: ${player.primary_role}` : 'Sin rol registrado';

  const tierText = rank ? `${TIER_LABEL[rank.tier] ?? rank.tier} ${rank.division ?? ''}`.trim() : 'Unranked';
  document.getElementById('p-tier').textContent = tierText;
  document.getElementById('p-lp').textContent = rank ? `${rank.lp ?? 0} LP` : '—';
  const emblem = document.getElementById('p-emblem');
  emblem.style.visibility = '';
  emblem.src = emblemUrl(rank?.tier);
  emblem.onerror = () => { emblem.style.visibility = 'hidden'; };

  // Fondo: campeón en vivo si está en partida, si no su campeón/skin favorito.
  const champBg = live.in_game ? live.champion : player.favorite_champion;
  const skinBg = live.in_game ? 0 : (player.favorite_skin ?? 0);
  document.getElementById('p-splash').style.backgroundImage = champBg ? `url('${splashUrl(champBg, skinBg)}')` : '';
}

// ── TAGS DESTACADOS: badges personales (se calculan acá) + badges semanales del backend ──
function renderTags(player, rank, position, soloq, weeklyBadges, firstWin, nameById) {
  const tags = [];

  // Top 1/2/3 del Torneo — posición ACTUAL en el ranking (igual que el sitio viejo).
  if (rank && position && position <= 3) {
    const medal = ['🥇', '🥈', '🥉'][position - 1];
    tags.push({ icono: medal, label: `Top ${position} del Torneo`, detail: 'Posición actual en el ranking', cls: 'gold' });
  }

  // Rey de la Temporada — ojo: esta fila solo actualiza player_id (no player_ids).
  const rey = weeklyBadges.find(b => b.category === 'rey_temporada');
  if (rey && rey.player_id === player.id) {
    tags.push({ icono: '👑', label: 'Rey de la Temporada', detail: rey.detail ?? '', cls: 'gold' });
  }

  // Primera Victoria del Día
  if (firstWin?.player_id === player.id && firstWin.won_at) {
    const hora = new Date(firstWin.won_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' });
    tags.push({ icono: '🌅', label: 'Primera Victoria del Día', detail: `${hora}h${firstWin.champion ? ' · ' + firstWin.champion : ''}`, champion: firstWin.champion, cls: 'gold' });
  }

  // Racha de victorias / derrotas
  const streak = getStreak(soloq);
  if (streak) {
    tags.push(streak.tipo === 'fire'
      ? { icono: '🔥', label: 'En Racha', detail: `${streak.n} victorias seguidas` }
      : { icono: '❄️', label: 'Racha Fría', detail: `${streak.n} derrotas seguidas`, cls: 'warn' });
  }

  // Ciego — no compró ward de control en 6+ de sus últimas 10 de SoloQ.
  // Personal (no compara contra nadie). Solo cuentan partidas con el dato
  // guardado; los remakes quedan afuera.
  const conDatoWard = soloq.filter(m => !esRemake(m)).slice(0, 10)
    .filter(m => typeof m.extra_stats?.wards_control === 'number');
  const sinWard = conDatoWard.filter(m => m.extra_stats.wards_control === 0).length;
  if (sinWard >= 6) {
    tags.push({ icono: '🦯', label: 'Ciego', detail: `${sinWard}/${conDatoWard.length} partidas sin ward de control`, cls: 'warn' });
  }

  // Badges semanales / últimas 10 que calcula el backend (con soporte de empates).
  weeklyBadges.forEach(b => {
    const meta = BADGE_META[b.category];
    if (!meta) return;
    const ids = (b.player_ids?.length ? b.player_ids : [b.player_id]);
    if (!ids.includes(player.id)) return;
    const compartido = ids.length > 1
      ? ` (empate con ${ids.filter(id => id !== player.id).map(id => nameById.get(id) ?? '?').join(', ')})` : '';
    tags.push({ icono: meta.icono, label: meta.label, detail: `${b.detail ?? ''}${compartido}`, champion: b.champion });
  });

  const el = document.getElementById('tags-list');
  if (!tags.length) {
    el.innerHTML = `<div class="tags-empty">Todavía no tiene ningún destacado.</div>`;
    return;
  }
  el.innerHTML = tags.map(t => `
    <div class="tag-card ${t.cls ?? ''}">
      <div class="ico">${t.icono}</div>
      <div style="min-width:0;">
        <div class="tag-label">${esc(t.label)}</div>
        <div class="tag-detail">${t.champion ? `<img class="tag-champ-icon" src="${champIconUrl(t.champion)}" alt="" onerror="${HIDE_ONERROR}">` : ''}<span>${esc(t.detail)}</span></div>
      </div>
    </div>`).join('');
}

  const wrap = document.getElementById('twitch-wrap');

    wrap.classList.remove('visible');

  liveGameStartTime = game?.started_at ? new Date(game.started_at).getTime() : null;

  const esAzul = live.team === 'blue';

  const duo = allLiveStatus.filter(l => l.in_game && l.game_id === live.game_id && l.player_id !== live.player_id && (l.team == null || live.team == null || l.team === live.team));

          <div class="live-game-duo-info">

function renderTopChamps(soloq) {
  const counts = new Map();
  soloq.forEach(m => counts.set(m.champion, (counts.get(m.champion) ?? 0) + 1));
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
  document.getElementById('box-champs').innerHTML = top.length ? top.map(([champ, n]) => `
    <div class="list-item">
      <img class="champ-img" src="${champIconUrl(champ)}" alt="" onerror="${HIDE_ONERROR}">
      <div><div class="item-title">${esc(champ)}</div><div class="item-sub">${n} partida${n === 1 ? '' : 's'} reciente${n === 1 ? '' : 's'}</div></div>
    </div>`).join('') : '<span class="item-sub">No ha jugado SoloQ recientemente.</span>';
}

function renderRoles(soloq) {
  const counts = new Map();
  soloq.forEach(m => { if (m.role) counts.set(m.role, (counts.get(m.role) ?? 0) + 1); });

// ── HISTORIAL con pestañas ──
function renderTabs() {
  const el = document.getElementById('queue-tabs');
  el.innerHTML = QUEUE_TABS.map(t => {
    const n = historyState.byTab.get(t.key)?.length ?? 0;
    return `<button class="queue-tab ${t.key === currentTab ? 'active' : ''}" data-tab="${t.key}">${t.label}<span class="count">${n}</span></button>`;
  }).join('');
  el.querySelectorAll('.queue-tab').forEach(btn => btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    renderTabs();

}

function renderHistory() {
  const tab = QUEUE_TABS.find(t => t.key === currentTab);
  document.getElementById('history-title').textContent = `Historial reciente (${tab.label})`;
  const el = document.getElementById('box-history');
  const lista = (historyState.byTab.get(currentTab) ?? []).slice(0, HISTORY_PER_TAB);
  if (!lista.length) { el.innerHTML = `<p class="empty">Sin partidas de ${tab.label} en los últimos 30 días.</p>`; return; }

  const { companionsByMatch, nameById, playerId } = historyState;
  el.innerHTML = lista.map(m => {
    const duoNames = (companionsByMatch.get(m.match_id) ?? [])
      .filter(c => c.team === m.team && c.player_id !== playerId && nameById.has(c.player_id))
      .map(c => esc(nameById.get(c.player_id)));

    const spellsHtml = (m.summoner_spells ?? [])
      .map(sid => { const url = spellIconUrl(sid); return url ? `<img src="${url}" alt="" onerror="${HIDE_ONERROR}">` : ''; }).join('');
    const keystoneUrl = runeIconUrl(m.keystone_perk);
    const secundariaUrl = runeIconUrl(m.secondary_style);
    const runesHtml = (keystoneUrl || secundariaUrl) ? `
      <span class="match-runes">
        ${keystoneUrl ? `<img src="${keystoneUrl}" alt="" onerror="${HIDE_ONERROR}">` : ''}
        ${secundariaUrl ? `<img src="${secundariaUrl}" alt="" onerror="${HIDE_ONERROR}">` : ''}
      </span>` : '';

    const resultado = esRemake(m) ? 'remake' : (m.win ? 'victoria' : 'derrota');
    const kda = `${m.kills ?? 0}/${m.deaths ?? 0}/${m.assists ?? 0}`;
    // En "Otros" se muestra el modo exacto (ARAM, Arena, Partida Rápida…).
    const modoHtml = currentTab === 'otros' ? `<span class="match-mode">${esc(m.matches.queue_type ?? 'Modo Destacado')}</span>` : '';
    const egidaHtml = m.extra_stats?.posible_egida
      ? `<span class="egida-tag" title="Ganaste bastante más LP de lo normal en esta partida — probablemente Égida de Valor (LP doble por autocompletado). Es una estimación, Riot no lo confirma directamente."><img src="assets/Aegis_of_Valor_icon.svg" alt="">Égida de Valor</span>`
      : '';
    const dur = formatDuration(m.matches.duration_seconds);
    const lpHtml = (m.lp_change ?? null) !== null
      ? `<span class="lp-change ${m.lp_change >= 0 ? 'win' : 'loss'}">${m.lp_change >= 0 ? '+' : ''}${m.lp_change} LP</span>`
      : (dur ? `<span class="lp-change dur">${dur}</span>` : '');

    return `
      <div class="match">
        <span class="match-icons">
          <img class="champ-icon" src="${champIconUrl(m.champion)}" alt="" onerror="${HIDE_ONERROR}">
          ${spellsHtml ? `<span class="match-spells">${spellsHtml}</span>` : ''}
          ${runesHtml}
        </span>
        <span>
          <div class="match-champ">${esc(m.champion)}${modoHtml}</div>
          <div class="match-kda">${kda} KDA</div>

          <span class="result-chip ${resultado}">${resultado === 'victoria' ? 'Victoria' : resultado === 'remake' ? 'Remake' : 'Derrota'}</span>
          ${lpHtml}
          ${egidaHtml}
        </span>
      </div>`;
  }).join('');
}

// ── CONSEJO DE IA ──
// Primero se mira si ya hay un consejo guardado para la última partida de
// SoloQ del jugador; si sí, se muestra al instante sin llamar a nadie. Si
// no (o hay partida nueva), se le pide a la Edge Function, que genera uno
// nuevo con Gemini y lo guarda.
function setupAiButton() {
  const fab = document.getElementById('ai-fab');
  const panel = document.getElementById('ai-panel');
  fab.addEventListener('click', () => {
    const abrir = !panel.classList.contains('open');
    panel.classList.toggle('open', abrir);
    if (abrir) loadAiAdvice();
  });
  document.getElementById('ai-close').addEventListener('click', () => panel.classList.remove('open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') panel.classList.remove('open'); });
}

async function loadAiAdvice() {
  if (aiState.loading || !aiState.playerId) return;
  const body = document.getElementById('ai-body');
  aiState.loading = true;
  try {
    if (!aiState.latestMatchId) {
      body.innerHTML = `<p>Todavía no hay partidas de SoloQ suficientes para analizar este perfil.</p>`;
      return;
    }
    const { data: cached } = await supabase.from('profile_ai_advice').select('*').eq('player_id', aiState.playerId).maybeSingle();
    if (cached && cached.last_match_id === aiState.latestMatchId) {
      renderAiAdvice(cached.advice, cached.generated_at);
      return;
    }

    body.innerHTML = `<div class="ai-loading"><span class="ai-spinner"></span>${cached ? 'Hay partidas nuevas, actualizando la valoración…' : 'Analizando el perfil…'}</div>`;
    const { data, error } = await supabase.functions.invoke('generate-profile-advice', { body: { player_id: aiState.playerId } });
    if (error) {
      let msg = 'No se pudo generar la valoración ahora mismo.';
      try { msg = (await error.context?.json())?.error ?? msg; } catch { /* sin detalle */ }
      // Si falla pero había una versión anterior guardada, se muestra igual.
      if (cached) { renderAiAdvice(cached.advice, cached.generated_at, msg); return; }
      body.innerHTML = `<p class="ai-error">${esc(msg)}</p>`;
      return;
    }
    if (data?.status === 'sin_datos') {
      body.innerHTML = `<p>Hacen falta al menos ${data.minimo} partidas de SoloQ para analizar el perfil (tiene ${data.partidas}).</p>`;
      return;
    }
    renderAiAdvice(data.advice, data.generated_at);
  } catch (e) {
    console.error('IA', e);
    body.innerHTML = `<p class="ai-error">No se pudo generar la valoración ahora mismo.</p>`;
  } finally {
    aiState.loading = false;
  }
}

function renderAiAdvice(advice, generatedAt, aviso) {
  const body = document.getElementById('ai-body');
  const base = advice?.base ?? {};
  const champs = Array.isArray(advice?.mejores_campeones) ? advice.mejores_campeones : [];
  const tips = Array.isArray(advice?.consejos) ? advice.consejos : [];
  const fecha = generatedAt ? new Date(generatedAt).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }) : '';
  body.innerHTML = `
    ${aviso ? `<p class="ai-error" style="margin-bottom:12px;">${esc(aviso)} Mostrando la valoración anterior.</p>` : ''}
    ${base.partidas ? `<div class="ai-stats">
      <span class="ai-stat">${base.partidas} partidas SoloQ</span>
      <span class="ai-stat">${base.wins}V / ${base.partidas - base.wins}D</span>
      <span class="ai-stat">${base.winrate}% WR</span>
    </div>` : ''}
    <h4>Estilo de juego</h4>
    <p>${esc(advice?.estilo ?? '')}</p>
    ${champs.length ? `<h4>Mejores campeones</h4>${champs.map(c => `
      <div class="ai-champ">
        <img src="${champIconUrl(c.campeon)}" alt="" onerror="${HIDE_ONERROR}">
        <div><b>${esc(c.campeon)}</b> — ${esc(c.motivo)}</div>
      </div>`).join('')}` : ''}
    ${advice?.mejor_rol?.rol ? `<h4>Mejor rol probable</h4><p><b>${esc(advice.mejor_rol.rol)}</b> — ${esc(advice.mejor_rol.motivo ?? '')}</p>` : ''}
    ${tips.length ? `<h4>Consejos de mejora</h4><ol class="ai-tips">${tips.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}
    <div class="ai-foot">Generado ${esc(fecha)} con las últimas partidas de SoloQ. Se actualiza solo cuando juega una partida nueva. Es una estimación basada en números, no en ver las partidas.</div>`;
}

// ── GRÁFICA DE LP ──
async function renderLpChart(playerId) {
  const section = document.getElementById('lp-chart-section');
  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
  const { data: puntosRaw } = await supabase.from('rank_snapshots').select('*')
    .eq('player_id', playerId).eq('queue_type', 'RANKED_SOLO_5x5')
    .gte('recorded_at', sevenDaysAgo).order('recorded_at', { ascending: true });

  const puntos = (puntosRaw ?? []).filter(p => p.elo_score != null);
  if (puntos.length < 2) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  const first = puntos[0].elo_score, last = puntos[puntos.length - 1].elo_score;
  const delta = last - first;
  const deltaEl = document.getElementById('lp-delta');
  if (delta > 0) { deltaEl.textContent = `+${delta} LP`; deltaEl.className = 'lp-delta up'; }
  else if (delta < 0) { deltaEl.textContent = `${delta} LP`; deltaEl.className = 'lp-delta down'; }
  else { deltaEl.textContent = 'Sin cambio'; deltaEl.className = 'lp-delta flat'; }

  const fmtDate = iso => { const d = new Date(iso); return `${d.getDate()}/${d.getMonth() + 1}`; };
  document.getElementById('lp-date-start').textContent = fmtDate(puntos[0].recorded_at);
  document.getElementById('lp-date-end').textContent = fmtDate(puntos.at(-1).recorded_at);
  document.getElementById('lp-range-label').textContent =
    `${TIER_LABEL[puntos[0].tier] ?? puntos[0].tier} ${puntos[0].division ?? ''} → ${TIER_LABEL[puntos.at(-1).tier] ?? puntos.at(-1).tier} ${puntos.at(-1).division ?? ''}`.trim();

  const canvas = document.getElementById('lp-canvas');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 40, H = 90;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const scores = puntos.map(p => p.elo_score);
  const minS = Math.min(...scores), maxS = Math.max(...scores), rangeS = (maxS - minS) || 1;
  const PAD_X = 4, PAD_Y = 8;
  const toX = i => PAD_X + (i / (puntos.length - 1)) * (W - PAD_X * 2);
  const toY = s => PAD_Y + (1 - (s - minS) / rangeS) * (H - PAD_Y * 2);

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(0,229,199,0.25)');
  grad.addColorStop(1, 'rgba(0,229,199,0)');
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(scores[0]));
  for (let i = 1; i < scores.length; i++) ctx.lineTo(toX(i), toY(scores[i]));
  ctx.lineTo(toX(scores.length - 1), H); ctx.lineTo(toX(0), H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(scores[0]));
  for (let i = 1; i < scores.length; i++) ctx.lineTo(toX(i), toY(scores[i]));
  ctx.strokeStyle = '#00e5c7'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

  const lastX = toX(scores.length - 1), lastY = toY(scores.at(-1));
  ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#facc15'; ctx.fill();
  ctx.strokeStyle = '#030812'; ctx.lineWidth = 1.5; ctx.stroke();
}
