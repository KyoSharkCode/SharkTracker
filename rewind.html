<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SoloQ Rewind · SharkTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030812; --panel:rgba(10,22,34,.7); --border:#16324a; --text:#fff; --text-dim:#9db3c4; --text-faint:#6d8ba3;
    --accent:#00e5c7; --accent-glow:rgba(0,229,199,.45); --danger:#ff5f3d; --gold:#facc15; --pink:#ff5fa8; --violet:#a66bff; --radius:16px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{margin:0; color:var(--text); font-family:'Inter',system-ui,sans-serif; background:var(--bg); overflow-x:hidden;}
  a{color:inherit;}

  /* ── Selector (sin jugador) ── */
  .wrap{max-width:1000px; margin:0 auto; padding:44px 20px 80px;}
  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:26px; padding-bottom:24px; border-bottom:1px solid var(--border);}
  .logo-slot{display:flex; align-items:center; gap:14px;} .logo-slot img{height:40px; display:block;}
  h1{grid-column:2; margin:0; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(26px,4vw,38px); letter-spacing:.03em; text-transform:uppercase;
     background:linear-gradient(90deg,#fff 0%,var(--accent) 60%,var(--pink) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .auth-slot{grid-column:3; justify-self:end;}
  .avatar{width:40px; height:40px; border-radius:50%; background:#0a1622; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--accent); text-decoration:none; overflow:hidden;}
  .avatar img{width:100%; height:100%; object-fit:cover;} .avatar.pending{border-color:var(--gold); color:var(--gold);}
  .login-btn{background:var(--accent); color:#032018; font-family:'Rajdhani',sans-serif; font-weight:700; padding:8px 18px; border-radius:8px; text-decoration:none; font-size:14px;}
  .lead{color:var(--text-dim); font-size:14.5px; line-height:1.6; text-align:center; margin:0 auto 22px; max-width:620px;}
  .splits{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:24px;}
  .chip{border:1px solid var(--border); background:var(--panel); color:var(--text-dim); border-radius:99px; padding:8px 15px; font:700 13px Inter,sans-serif; cursor:pointer;}
  .chip.on{border-color:var(--accent); color:#fff; background:rgba(0,229,199,.12);}
  .chip small{color:var(--text-faint); font-weight:600; margin-left:4px;}
  .who-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .who{position:relative; display:block; overflow:hidden; border-radius:16px; border:1px solid var(--border); min-height:150px; text-decoration:none; background:#06111c; transition:border-color .15s, transform .15s;}
  .who:hover{border-color:var(--accent); transform:translateY(-2px);}
  .who .art{position:absolute; inset:0; background-size:cover; background-position:center 20%;}
  .who::after{content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(3,8,18,.95) 15%, rgba(3,8,18,.2));}
  .who .in{position:absolute; left:14px; right:14px; bottom:12px; z-index:1;}
  .who b{display:block; font-family:'Rajdhani',sans-serif; font-size:21px; letter-spacing:.03em;}
  .who small{color:var(--text-dim); font-size:12px;}
  .msg{padding:60px 20px; text-align:center; color:var(--text-dim);}

  /* ── Historias ── */
  .stage{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:#01040a;}
  .stage .blur{position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(40px) brightness(.35) saturate(1.3); transition:background-image .4s;}
  .story{position:relative; width:min(100vw, calc(100dvh * 9 / 16), 480px); height:min(100dvh, 853px); overflow:hidden; border-radius:22px; background:#050b16; box-shadow:0 30px 80px rgba(0,0,0,.6);}
  @media (max-width:520px){ .story{width:100vw; height:100dvh; border-radius:0;} }
  .bars{position:absolute; top:12px; left:12px; right:12px; z-index:6; display:flex; gap:4px;}
  .bars i{flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; position:relative;}
  .bars i.done::after, .bars i.on::after{content:''; position:absolute; inset:0; background:#fff;}
  .topline{position:absolute; top:24px; left:14px; right:14px; z-index:6; display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:700;}
  .topline img{width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.6);}
  .topline small{color:rgba(255,255,255,.7); font-weight:600;}
  .topline .x{margin-left:auto; width:34px; height:34px; border-radius:50%; border:none; background:rgba(0,0,0,.35); color:#fff; font-size:20px; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center;}
  .tap{position:absolute; top:70px; bottom:0; z-index:5; width:35%; cursor:pointer; background:none; border:none;}
  .tap.prev{left:0;} .tap.next{right:0; width:65%;}
  .slide{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:90px 28px 70px; text-align:left;}
  .slide .bg{position:absolute; inset:0; background-size:cover; background-position:center 20%; z-index:0;}
  .slide .shade{position:absolute; inset:0; z-index:0;}
  .slide > .c{position:relative; z-index:1; display:flex; flex-direction:column; gap:14px;}
  .k{font-size:12px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--accent);}
  .big{font-family:'Rajdhani',sans-serif; font-weight:800; font-size:78px; line-height:.9; letter-spacing:.01em;}
  .mid{font-family:'Rajdhani',sans-serif; font-weight:800; font-size:40px; line-height:1; letter-spacing:.02em; text-transform:uppercase;}
  .t{font-size:17px; line-height:1.45; color:#e6f1f8;} .t b{color:#fff;}
  .sub{font-size:13.5px; color:var(--text-dim); line-height:1.5;}
  .grad{background:linear-gradient(90deg,#fff, var(--accent) 60%, var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .gold{color:var(--gold);} .pink{color:var(--pink);} .red{color:#ff8a6b;} .teal{color:var(--accent);}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 12px; min-width:92px;}
  .pill b{display:block; font-family:'Rajdhani',sans-serif; font-size:26px; line-height:1;} .pill small{font-size:11px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .mini{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;}
  .mini img{width:40px; height:40px; border-radius:10px; border:1px solid rgba(255,255,255,.2);}
  .mini small{color:var(--text-dim); font-weight:600;}
  .rolebar{display:grid; grid-template-columns:70px 1fr 44px; align-items:center; gap:10px; font-size:13px; font-weight:700;}
  .rolebar i{display:block; height:12px; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--violet));}
  .rolebar span:last-child{text-align:right; color:var(--text-dim);}
  .ranks{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:6px; text-align:center;}
  .ranks .r img{width:64px; height:64px; object-fit:contain; display:block; margin:0 auto 4px;}
  .ranks .r b{display:block; font-size:14px;} .ranks .r small{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:800;}
  .ranks .ar{font-size:20px; color:var(--text-faint);}
  .people{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .person{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px;}
  .person img{width:54px; height:54px; border-radius:50%; border:2px solid var(--accent);}
  .person.nem img{border-color:var(--danger);}
  .person b{font-size:16px;} .person small{font-size:12px; color:var(--text-dim); line-height:1.4;}
  .summary{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .summary div{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 12px;}
  .summary small{display:block; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);}
  .summary b{font-size:15px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; position:relative; z-index:7;}
  .btn{border:none; border-radius:10px; padding:11px 16px; font:800 13.5px Inter,sans-serif; background:var(--accent); color:#032018; cursor:pointer; text-decoration:none;}
  .btn.ghost{background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2);}
  .hint{position:absolute; bottom:18px; left:0; right:0; z-index:6; text-align:center; font-size:11.5px; color:rgba(255,255,255,.55); pointer-events:none;}
  .badge-now{display:inline-block; align-self:flex-start; font-size:11px; font-weight:900; letter-spacing:.08em; color:#032018; background:var(--gold); border-radius:99px; padding:4px 10px;}
  /* Animación de entrada */
  .slide .c > *{opacity:0; transform:translateY(16px); animation:up .55s cubic-bezier(.2,.8,.2,1) forwards;}
  .slide .c > *:nth-child(2){animation-delay:.12s;} .slide .c > *:nth-child(3){animation-delay:.24s;} .slide .c > *:nth-child(4){animation-delay:.36s;}
  .slide .c > *:nth-child(5){animation-delay:.48s;} .slide .c > *:nth-child(6){animation-delay:.6s;} .slide .c > *:nth-child(n+7){animation-delay:.7s;}
  @keyframes up{to{opacity:1; transform:none;}}
  .slide .bg{animation:zoom 9s ease-out forwards;} @keyframes zoom{from{transform:scale(1.12);} to{transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){ .slide .c > *, .slide .bg{animation:none; opacity:1; transform:none;} }
</style>
</head>
<body>
<div class="wrap" id="picker">
  <header>
    <div class="logo-slot"><a href="index.html"><img src="logo/FlaviIconLogo.png" alt="SharkTracker"></a></div>
    <h1>SoloQ Rewind</h1>
    <div class="auth-slot" id="auth-slot"></div>
  </header>
  <p class="lead">Tu split de SoloQ en unas cuantas historias: partidas, campeón estrella, rachas, tu dúo, tu némesis y de dónde a dónde llegaste. Elige el split y a quién quieres ver.</p>
  <div class="splits" id="splits"></div>
  <div id="pick-body"><div class="msg">Cargando…</div></div>
</div>

<div class="stage" id="stage" hidden>
  <div class="blur" id="blur"></div>
  <div class="story" id="story">
    <div class="bars" id="bars"></div>
    <div class="topline" id="topline"></div>
    <div id="slide-host"></div>
    <button class="tap prev" id="tap-prev" type="button" aria-label="Anterior"></button>
    <button class="tap next" id="tap-next" type="button" aria-label="Siguiente"></button>
    <div class="hint" id="hint">Toca a la derecha para seguir · ← → en el teclado</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { createAuthMenu } from './assets/auth-menu.js';
import { createNavMenu } from './assets/nav-menu.js';
import { loadCatalogs, champName, champImg, splashUrl, profileIconUrl, emblemUrl, rankText, roleLabel, esc } from './assets/lol-data.js';
createNavMenu({ current: 'rewind' });

const SUPABASE_URL = 'https://mvupiohecvoiwuxwjdrt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dXBpb2hlY3ZvaXd1eHdqZHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDI1NTcsImV4cCI6MjEwNTU3ODU1N30.6vNCdX63tpyGnGII15Mjznq7BwhafH9KmnI-Os2SO4M';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const authMenu = createAuthMenu({ supabase, profileIconUrl });
const params = new URL(location.href).searchParams;

const st = { splits: [], split: null, players: [], profiles: new Map(), games: [], session: null };
const fmtDate = (iso) => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
const n1 = (x) => (Math.round(x * 10) / 10).toLocaleString('es-ES');
const nInt = (x) => Math.round(x).toLocaleString('es-ES');
const favOf = (p) => { const pr = st.profiles.get(p.id) ?? {}; return pr.favorite_champion ? [pr.favorite_champion, pr.favorite_skin ?? 0] : [p.favorite_champion, p.favorite_skin ?? 0]; };
const favSplash = (p) => { const [c, k] = favOf(p); return c ? splashUrl(c, k) : null; };
const isCurrent = (sp) => new Date(sp.starts_at) <= new Date() && (!sp.ends_at || new Date(sp.ends_at) > new Date());
const kdaOf = (list) => { const k = list.reduce((a, g) => a + (g.kills ?? 0), 0), d = list.reduce((a, g) => a + (g.deaths ?? 0), 0), as = list.reduce((a, g) => a + (g.assists ?? 0), 0); return d ? (k + as) / d : k + as; };
const wrOf = (list) => list.length ? Math.round(100 * list.filter(g => g.win).length / list.length) : 0;

// ── Datos ──
async function loadAll() {
  const [{ data: { session } }, { data: players }, { data: profiles }, { data: splits }] = await Promise.all([
    supabase.auth.getSession(), supabase.from('players').select('*'), supabase.from('player_profiles').select('*'),
    supabase.from('splits').select('*').order('starts_at', { ascending: false }), loadCatalogs(),
  ]);
  st.session = session;
  authMenu.render(session, players ?? [], profiles ?? []);
  st.players = players ?? []; (profiles ?? []).forEach(p => st.profiles.set(p.player_id, p));
  st.splits = (splits ?? []).filter(s => new Date(s.starts_at) <= new Date());
}
async function loadGames(sp) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = supabase.from('rewind_games').select('*').gte('ended_at', sp.starts_at);
    if (sp.ends_at) q = q.lt('ended_at', sp.ends_at);
    const { data, error } = await q.order('ended_at', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    out.push(...(data ?? []));
    if (!data || data.length < 1000) break;
  }
  st.games = out;
}
async function loadRanks(pid, sp) {
  const day = (iso) => new Date(new Date(iso).toLocaleString('en-US', { timeZone: 'Europe/Madrid' })).toISOString().slice(0, 10);
  let q = supabase.from('rank_daily').select('*').eq('player_id', pid).gte('day', day(sp.starts_at));
  if (sp.ends_at) q = q.lte('day', day(sp.ends_at));
  const { data } = await q.order('day', { ascending: true });
  return data ?? [];
}

// ── Cálculo del Rewind de un jugador ──
function compute(p, ranks) {
  const mine = st.games.filter(g => g.player_id === p.id);
  if (!mine.length) return null;
  const R = { p, games: mine.length, wins: mine.filter(g => g.win).length, hours: mine.reduce((a, g) => a + g.duration_seconds, 0) / 3600 };
  R.wr = wrOf(mine); R.kda = kdaOf(mine);
  // Puesto del grupo en partidas
  const counts = new Map(); st.games.forEach(g => counts.set(g.player_id, (counts.get(g.player_id) ?? 0) + 1));
  R.rankGames = [...counts.values()].sort((a, b) => b - a).indexOf(mine.length) + 1; R.groupSize = counts.size;
  // Campeones
  const byChamp = new Map(); mine.forEach(g => (byChamp.get(g.champion) ?? byChamp.set(g.champion, []).get(g.champion)).push(g));
  R.champs = [...byChamp.entries()].map(([c, l]) => ({ c, n: l.length, wr: wrOf(l), kda: kdaOf(l) })).sort((a, b) => b.n - a.n || b.wr - a.wr);
  R.uniqueChamps = byChamp.size;
  // Roles
  const byRole = new Map(); mine.forEach(g => { const r = roleLabel(g.role); if (r) byRole.set(r, (byRole.get(r) ?? 0) + 1); });
  R.roles = [...byRole.entries()].sort((a, b) => b[1] - a[1]);
  // Rachas
  let best = { n: 0 }, worst = { n: 0 }, cur = null;
  mine.forEach(g => {
    if (!cur || cur.win !== g.win) cur = { win: g.win, n: 0, from: g.ended_at };
    cur.n++; cur.to = g.ended_at;
    if (cur.win && cur.n > best.n) best = { ...cur }; if (!cur.win && cur.n > worst.n) worst = { ...cur };
  });
  R.best = best; R.worst = worst;
  // Partida del split
  R.top = mine.filter(g => g.score != null).sort((a, b) => b.score - a.score)[0] ?? null;
  // Dúo y némesis (solo otros del grupo)
  const byMatch = new Map(); st.games.forEach(g => (byMatch.get(g.match_id) ?? byMatch.set(g.match_id, []).get(g.match_id)).push(g));
  const duo = new Map(), nem = new Map();
  mine.forEach(g => (byMatch.get(g.match_id) ?? []).forEach(o => {
    if (o.player_id === p.id) return;
    if (o.team === g.team) { const d = duo.get(o.player_id) ?? { n: 0, w: 0 }; d.n++; if (g.win) d.w++; duo.set(o.player_id, d); }
    else { const d = nem.get(o.player_id) ?? { n: 0, lost: 0 }; d.n++; if (!g.win) d.lost++; nem.set(o.player_id, d); }
  }));
  const pl = (id) => st.players.find(x => x.id === id);
  const d1 = [...duo.entries()].sort((a, b) => b[1].n - a[1].n || b[1].w - a[1].w)[0];
  R.duo = d1 ? { p: pl(d1[0]), ...d1[1], wr: Math.round(100 * d1[1].w / d1[1].n) } : null;
  const n1_ = [...nem.entries()].sort((a, b) => b[1].lost - a[1].lost || b[1].n - a[1].n)[0];
  R.nem = n1_ && n1_[1].lost > 0 ? { p: pl(n1_[0]), ...n1_[1] } : null;
  // Rango
  if (ranks.length) {
    const f = ranks[0], l = ranks.at(-1), pk = ranks.reduce((a, r) => (r.peak_elo ?? -1) > (a.peak_elo ?? -1) ? r : a, ranks[0]);
    R.rank = { first: { tier: f.first_tier, division: f.first_division, lp: f.first_lp, elo: f.first_elo },
               peak: { tier: pk.peak_tier, division: pk.peak_division, lp: pk.peak_lp },
               last: { tier: l.last_tier, division: l.last_division, lp: l.last_lp, elo: l.last_elo } };
  }
  R.lpNet = mine.reduce((a, g) => a + (g.lp_change ?? 0), 0);
  // Curiosidades
  R.kills = mine.reduce((a, g) => a + (g.kills ?? 0), 0); R.deaths = mine.reduce((a, g) => a + (g.deaths ?? 0), 0);
  R.assists = mine.reduce((a, g) => a + (g.assists ?? 0), 0); R.pentas = mine.reduce((a, g) => a + (g.pentakills ?? 0), 0);
  R.maxKills = mine.reduce((a, g) => (g.kills ?? 0) > (a?.kills ?? -1) ? g : a, null);
  R.longest = mine.reduce((a, g) => g.duration_seconds > (a?.duration_seconds ?? 0) ? g : a, null);
  const hours = new Array(24).fill(0); mine.forEach(g => hours[new Date(g.ended_at).getHours()]++);
  R.favHour = hours.indexOf(Math.max(...hours));
  return R;
}

// ── Diapositivas ──
function slides(R, sp) {
  const p = R.p, name = esc(p.riot_game_name), fav = favSplash(p);
  const S = [];
  const bg = (url, shade = 'linear-gradient(0deg, rgba(3,8,18,.96) 25%, rgba(3,8,18,.55) 60%, rgba(3,8,18,.3))') =>
    `${url ? `<div class="bg" style="background-image:url('${url}')"></div>` : ''}<div class="shade" style="background:${shade}"></div>`;
  const glow = (a, b) => `<div class="shade" style="background:radial-gradient(600px 400px at 20% 10%, ${a}, transparent 60%), radial-gradient(600px 500px at 90% 90%, ${b}, transparent 60%), #050b16"></div>`;
  S.push({ bgimg: fav, html: `${bg(fav)}<div class="c">
      ${isCurrent(sp) ? '<span class="badge-now">AVANCE · EL SPLIT SIGUE EN CURSO</span>' : ''}
      <div class="k">SoloQ Rewind</div>
      <div class="mid grad">${esc(sp.name)}</div>
      <div class="big">${name}</div>
      <div class="t">Esto fue tu split en la Grieta. ¿Listo?</div></div>` });
  S.push({ html: `${glow('rgba(0,229,199,.35)', 'rgba(166,107,255,.3)')}<div class="c">
      <div class="k">Tiempo en la Grieta</div>
      <div class="t">Este split jugaste</div>
      <div class="big grad">${R.games}</div>
      <div class="mid">partidas de SoloQ</div>
      <div class="t">Eso son <b>${n1(R.hours)} horas</b>${R.hours >= 24 ? ` (<b>${n1(R.hours / 24)} días</b> seguidos)` : ''} en la Grieta.</div>
      <div class="row"><div class="pill"><b class="teal">${R.wins}</b><small>victorias</small></div><div class="pill"><b class="red">${R.games - R.wins}</b><small>derrotas</small></div><div class="pill"><b>${R.wr}%</b><small>winrate</small></div></div>
      ${R.groupSize > 1 ? `<div class="sub">Fuiste el <b>#${R.rankGames}</b> del grupo en partidas jugadas.</div>` : ''}</div>` });
  const c0 = R.champs[0];
  S.push({ bgimg: splashUrl(c0.c, 0), html: `${bg(splashUrl(c0.c, 0))}<div class="c">
      <div class="k">Tu campeón del split</div>
      <div class="big">${esc(champName(c0.c))}</div>
      <div class="row"><div class="pill"><b>${c0.n}</b><small>partidas</small></div><div class="pill"><b>${c0.wr}%</b><small>winrate</small></div><div class="pill"><b>${n1(c0.kda)}</b><small>KDA</small></div></div>
      ${R.champs.length > 1 ? `<div class="sub" style="margin-top:6px">También te acompañaron</div>
      ${R.champs.slice(1, 3).map(c => `<div class="mini"><img src="${champImg(c.c)}" alt="">${esc(champName(c.c))} <small>· ${c.n} partidas · ${c.wr}%</small></div>`).join('')}` : ''}
      <div class="sub">Jugaste <b>${R.uniqueChamps}</b> campeón${R.uniqueChamps === 1 ? '' : 'es'} distinto${R.uniqueChamps === 1 ? '' : 's'}.</div></div>` });
  if (R.roles.length) {
    const tot = R.roles.reduce((a, r) => a + r[1], 0), ES = { TOP: 'Top', JUNGLE: 'Jungla', MID: 'Mid', ADC: 'ADC', SUPPORT: 'Support' };
    S.push({ html: `${glow('rgba(166,107,255,.35)', 'rgba(255,95,168,.25)')}<div class="c">
      <div class="k">Tu lugar en el mapa</div>
      <div class="mid">Fuiste <span class="grad">${ES[R.roles[0][0]]}</span></div>
      <div class="t">${Math.round(100 * R.roles[0][1] / tot)}% de tus partidas.</div>
      ${R.roles.map(([r, n]) => `<div class="rolebar"><span>${ES[r]}</span><i style="width:${Math.max(4, Math.round(100 * n / tot))}%"></i><span>${n}</span></div>`).join('')}</div>` });
  }
  S.push({ html: `${glow('rgba(250,204,21,.28)', 'rgba(255,95,61,.25)')}<div class="c">
      <div class="k">Rachas</div>
      ${R.best.n ? `<div class="t">🔥 Tu mejor racha</div><div class="big gold">${R.best.n}</div><div class="t">victorias seguidas <span class="sub">· ${fmtDate(R.best.from)}${fmtDate(R.best.from) !== fmtDate(R.best.to) ? ' → ' + fmtDate(R.best.to) : ''}</span></div>` : ''}
      ${R.worst.n ? `<div class="t" style="margin-top:14px">❄️ Y la que prefieres olvidar</div><div class="mid red">${R.worst.n} derrotas seguidas</div><div class="sub">${fmtDate(R.worst.from)}${fmtDate(R.worst.from) !== fmtDate(R.worst.to) ? ' → ' + fmtDate(R.worst.to) : ''}</div>` : ''}</div>` });
  if (R.top) {
    const g = R.top;
    S.push({ bgimg: splashUrl(g.champion, 0), html: `${bg(splashUrl(g.champion, 0))}<div class="c">
      <div class="k">La partida del split</div>
      <div class="big gold">${Math.round(g.score)}<span style="font-size:30px"> pts</span></div>
      <div class="mid">${esc(champName(g.champion))}</div>
      <div class="row"><div class="pill"><b>${g.kills}/${g.deaths}/${g.assists}</b><small>KDA</small></div><div class="pill"><b>${nInt(g.damage ?? 0)}</b><small>daño</small></div><div class="pill"><b class="${g.win ? 'teal' : 'red'}">${g.win ? 'V' : 'D'}</b><small>${fmtDate(g.ended_at)}</small></div></div>
      <div class="sub">La mejor puntuación de rendimiento que sacaste en todo el split.</div></div>` });
  }
  if (R.duo || R.nem) {
    const card = (x, cls, title, line) => `<div class="person ${cls}"><img src="${profileIconUrl(x.p?.icon_id) ?? profileIconUrl(29)}" alt=""><small>${title}</small><b>${esc(x.p?.riot_game_name ?? '?')}</b><small>${line}</small></div>`;
    S.push({ html: `${glow('rgba(0,229,199,.3)', 'rgba(255,95,61,.3)')}<div class="c">
      <div class="k">Tu gente</div>
      <div class="mid">Amigos y <span class="red">rivales</span></div>
      <div class="people">
        ${R.duo ? card(R.duo, '', '🤝 Tu dúo', `${R.duo.n} partidas juntos · ${R.duo.wr}% WR`) : '<div class="person"><small>🤝 Tu dúo</small><b>Nadie</b><small>No jugaste con nadie del grupo</small></div>'}
        ${R.nem ? card(R.nem, 'nem', '😈 Tu némesis', `Te ganó ${R.nem.lost} de ${R.nem.n} veces que se enfrentaron`) : '<div class="person nem"><small>😈 Tu némesis</small><b>Ninguno</b><small>Nadie del grupo te ganó</small></div>'}
      </div></div>` });
  }
  if (R.rank) {
    const r = (x, lbl) => `<div class="r"><img src="${emblemUrl(x.tier)}" alt=""><b>${esc(rankText(x))}</b><small>${lbl}</small></div>`;
    const up = (R.rank.last.elo ?? 0) - (R.rank.first.elo ?? 0);
    S.push({ bgimg: emblemUrl(R.rank.last.tier), html: `${glow('rgba(250,204,21,.25)', 'rgba(0,229,199,.3)')}<div class="c">
      <div class="k">Tu camino</div>
      <div class="mid">${up > 0 ? 'Subiste <span class="gold">✦</span>' : up < 0 ? 'Fue un split duro' : 'Te mantuviste firme'}</div>
      <div class="ranks">${r(R.rank.first, 'Empezaste')}<span class="ar">→</span>${r(R.rank.peak, 'Pico')}<span class="ar">→</span>${r(R.rank.last, isCurrent(sp) ? 'Ahora' : 'Terminaste')}</div>
      <div class="t">LP neto del split: <b class="${R.lpNet >= 0 ? 'teal' : 'red'}">${R.lpNet >= 0 ? '+' : ''}${R.lpNet} LP</b></div></div>` });
  }
  S.push({ html: `${glow('rgba(255,95,168,.3)', 'rgba(166,107,255,.3)')}<div class="c">
      <div class="k">Datos curiosos</div>
      <div class="row"><div class="pill"><b>${nInt(R.kills)}</b><small>asesinatos</small></div><div class="pill"><b>${nInt(R.deaths)}</b><small>muertes</small></div><div class="pill"><b>${nInt(R.assists)}</b><small>asistencias</small></div></div>
      ${R.pentas ? `<div class="t">🖐️ <b>${R.pentas} pentakill${R.pentas === 1 ? '' : 's'}</b>. Leyenda.</div>` : ''}
      ${R.maxKills ? `<div class="t">Tu partida más sangrienta: <b>${R.maxKills.kills} kills</b> con ${esc(champName(R.maxKills.champion))}.</div>` : ''}
      ${R.longest ? `<div class="t">La más larga duró <b>${Math.floor(R.longest.duration_seconds / 60)} minutos</b>.</div>` : ''}
      <div class="t">Tu hora favorita para jugar: <b>${String(R.favHour).padStart(2, '0')}:00</b>.</div></div>` });
  const url = `${location.origin}${location.pathname}?jugador=${encodeURIComponent(p.id)}&split=${sp.id}`;
  S.push({ bgimg: fav, final: true, html: `${bg(fav, 'linear-gradient(0deg, rgba(3,8,18,.97) 45%, rgba(3,8,18,.6))')}<div class="c">
      <div class="k">${esc(sp.name)}</div>
      <div class="mid">${name}</div>
      <div class="summary">
        <div><small>Partidas</small><b>${R.games} · ${R.wr}% WR</b></div>
        <div><small>Horas</small><b>${n1(R.hours)} h</b></div>
        <div><small>Campeón</small><b>${esc(champName(R.champs[0].c))}</b></div>
        <div><small>Mejor racha</small><b>🔥 ${R.best.n}</b></div>
        <div><small>Dúo</small><b>${esc(R.duo?.p?.riot_game_name ?? '—')}</b></div>
        <div><small>Némesis</small><b>${esc(R.nem?.p?.riot_game_name ?? '—')}</b></div>
        ${R.rank ? `<div><small>Rango</small><b>${esc(rankText(R.rank.last))}</b></div><div><small>LP neto</small><b>${R.lpNet >= 0 ? '+' : ''}${R.lpNet}</b></div>` : ''}
      </div>
      <div class="btns"><button class="btn" id="copy" data-url="${esc(url)}" type="button">🔗 Copiar link</button><a class="btn ghost" href="rewind.html?split=${sp.id}">Ver otro jugador</a><button class="btn ghost" id="again" type="button">↺ Otra vez</button></div></div>` });
  return S;
}

// ── Reproductor ──
let deck = [], idx = 0;
function show(i) {
  idx = Math.max(0, Math.min(deck.length - 1, i));
  const s = deck[idx];
  $('slide-host').innerHTML = `<section class="slide">${s.html}</section>`;
  $('bars').innerHTML = deck.map((_, k) => `<i class="${k < idx ? 'done' : k === idx ? 'on' : ''}"></i>`).join('');
  const bgUrl = s.bgimg ?? deck.slice(0, idx).reverse().find(x => x.bgimg)?.bgimg;
  $('blur').style.backgroundImage = bgUrl ? `url('${bgUrl}')` : '';
  $('hint').hidden = idx > 0;
  $('tap-next').hidden = !!s.final;
  $('copy')?.addEventListener('click', async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(b.dataset.url); b.textContent = '✅ Copiado'; } catch { prompt('Copia el link:', b.dataset.url); }
  });
  $('again')?.addEventListener('click', () => show(0));
}
$('tap-next').addEventListener('click', () => show(idx + 1));
$('tap-prev').addEventListener('click', () => show(idx - 1));
document.addEventListener('keydown', (e) => {
  if ($('stage').hidden) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(idx + 1); }
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key === 'Escape') location.href = `rewind.html?split=${st.split.id}`;
});
let tx = null;
$('story').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
$('story').addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1)); tx = null; });

async function play(p) {
  const ranks = await loadRanks(p.id, st.split);
  const R = compute(p, ranks);
  $('picker').hidden = true; $('stage').hidden = false; document.body.style.overflow = 'hidden';
  $('topline').innerHTML = `<img src="${profileIconUrl(p.icon_id) ?? profileIconUrl(29)}" alt=""><div>${esc(p.riot_game_name)}<br><small>${esc(st.split.name)}</small></div>
    <a class="x" href="rewind.html?split=${st.split.id}" aria-label="Cerrar">×</a>`;
  deck = R ? slides(R, st.split) : [{ final: true, html: `<div class="shade" style="background:#050b16"></div><div class="c">
      <div class="k">SoloQ Rewind · ${esc(st.split.name)}</div><div class="mid">${esc(p.riot_game_name)}</div>
      <div class="t">No hay partidas de SoloQ guardadas en este split 😴</div>
      <div class="sub">El Rewind guarda datos desde finales de agosto de 2026: los splits anteriores no tienen partidas.</div>
      <div class="btns"><a class="btn ghost" href="rewind.html?split=${st.split.id}">Ver otro jugador</a></div></div>` }];
  show(0);
}

// ── Selector ──
function renderPicker() {
  $('splits').innerHTML = st.splits.map(s => `<button class="chip ${s.id === st.split.id ? 'on' : ''}" data-split="${s.id}" type="button">${esc(s.name)}${isCurrent(s) ? '<small>en curso</small>' : ''}</button>`).join('');
  const counts = new Map(); st.games.forEach(g => counts.set(g.player_id, (counts.get(g.player_id) ?? 0) + 1));
  const list = [...st.players].sort((a, b) => (counts.get(b.id) ?? 0) - (counts.get(a.id) ?? 0));
  $('pick-body').innerHTML = `${isCurrent(st.split) ? '<p class="lead" style="margin-bottom:16px">Este split sigue en curso: lo que ves es un <b>avance</b>. El Rewind completo sale cuando termine.</p>' : ''}
    ${!st.games.length ? '<p class="lead">No hay partidas guardadas en este split: el Rewind guarda datos desde finales de agosto de 2026.</p>' : ''}
    <div class="who-grid">${list.map(p => `<a class="who" href="rewind.html?jugador=${encodeURIComponent(p.id)}&split=${st.split.id}">
      <div class="art" style="background-image:url('${favSplash(p) ?? ''}')"></div>
      <div class="in"><b>${esc(p.riot_game_name)}</b><small>${counts.get(p.id) ? `${counts.get(p.id)} partidas de SoloQ` : 'Sin partidas en este split'}</small></div></a>`).join('')}</div>`;
}
$('splits').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-split]'); if (!b) return;
  st.split = st.splits.find(s => String(s.id) === b.dataset.split);
  history.replaceState(null, '', `rewind.html?split=${st.split.id}`);
  await loadGames(st.split); renderPicker();
});

async function init() {
  await loadAll();
  if (!st.splits.length) { $('pick-body').innerHTML = '<div class="msg">Todavía no hay splits configurados.</div>'; return; }
  // Por defecto: el que pidan; si no, el que terminó hace menos de 3 semanas; si no, el actual.
  const want = st.splits.find(s => String(s.id) === params.get('split'));
  const recentEnded = st.splits.find(s => s.ends_at && new Date(s.ends_at) <= new Date() && (Date.now() - new Date(s.ends_at)) < 21 * 86400000);
  st.split = want ?? recentEnded ?? st.splits.find(isCurrent) ?? st.splits[0];
  await loadGames(st.split);
  const who = params.get('jugador');
  const p = who && st.players.find(x => x.id === who || x.riot_game_name.toLowerCase() === who.toLowerCase());
  if (p) return play(p);
  renderPicker();
}
init().catch(e => { $('pick-body').innerHTML = `<div class="msg">No se pudo cargar el Rewind: ${esc(e.message ?? e)}</div>`; });
</script>
</body>
