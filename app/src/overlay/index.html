<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- El overlay solo dibuja lo que le manda la app: fuentes de Google y retratos de campeones de Riot (DDragon). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://ddragon.leagueoflegends.com; base-uri 'none'; form-action 'none'">
<title>SharkTracker overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Coordenadas pensadas a 1920×1080; overlay.js calcula la escala (--s) y cada
       zona se ancla a su lado: la central a la barra de objetivos del juego y la
       derecha al borde derecho. -->
  <div class="zona zona-centro">
    <div id="baron" class="pill buff" hidden></div>
    <div id="ancestral" class="pill buff" hidden></div>
    <!-- Diferencia de oro: solo mientras mantienes Tab (sobre el marcador del juego) -->
    <div id="oro" class="oro" hidden></div>
  </div>

  <div class="zona zona-izquierda">
    <!-- Build completa en orden: aparece con Ctrl + X durante la partida -->
    <div id="build" class="build" hidden></div>
    <!-- Recordatorio del atajo, unos segundos al tener la build lista -->
    <div id="build-pista" class="pill build-pista" hidden></div>
  </div>

  <div class="zona zona-derecha">
    <!-- Pantalla de carga: rangos de los 10 jugadores (solo mientras carga la partida) -->
    <div id="carga" class="carga" hidden></div>
    <!-- Tu rendimiento vs la división de arriba: siempre a la vista, arriba a la derecha -->
    <div id="rendimiento" class="rend" hidden></div>
    <!-- Siguiente compra de tu build: abajo a la derecha, a la izquierda del minimapa -->
    <div id="siguiente" class="siguiente" hidden></div>
    <div id="avisos" class="columna">
      <div id="anuncio" class="pill aviso" hidden></div>
      <div id="toast" class="pill aviso" hidden></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
