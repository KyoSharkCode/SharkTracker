<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- El overlay solo dibuja lo que le manda la app: no carga nada de internet salvo las fuentes. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<title>SharkTracker overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Escenario de 1600×900 (el tamaño del mockup) que se escala a la pantalla. -->
  <div id="stage" class="stage">
    <div id="baron" class="toppill objpill" hidden></div>
    <div id="ancestral" class="toppill objpill" hidden></div>

    <div id="anuncio" class="toppill anuncio" hidden>
      <div class="pic"></div>
      <div>
        <div class="plabel titulo"></div>
        <div class="plabel sub">Sin reclamar</div>
      </div>
    </div>
    <div id="anuncio-dots" class="dotrow anuncio-dots" hidden></div>

    <div id="toast" class="toppill toast" hidden>
      <div class="pic"></div>
      <div>
        <div class="plabel titulo"></div>
        <div class="plabel sub"></div>
      </div>
    </div>
    <div id="toast-dots" class="dotrow toast-dots" hidden></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
