# Publica una versión nueva de la app de escritorio (SharkTracker para Windows).
#
# Cómo se usa: pestaña "Actions" del repo → "App: publicar versión" → "Run workflow".
# Toma la versión de app/package.json, arma el instalador en una máquina Windows
# de GitHub y lo sube como Release "vX.Y.Z". Las apps instaladas lo detectan y se
# actualizan solas. (No toca la web: GitHub Pages sigue igual.)
#
# En tres pasos: se crea un Release en BORRADOR (GitHub no deja crear uno ya publicado
# si la etiqueta vX.Y.Z todavía no existe), electron-builder sube ahí el instalador y
# latest.yml, y al final se publica el borrador, lo que crea la etiqueta.
name: "App: publicar versión"

on:
  workflow_dispatch:

permissions:
  contents: write   # para crear el Release y subir el instalador

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Preparar el Release en borrador
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::Ya existe el Release $VERSION publicado. Sube \"version\" en app/package.json (o borra ese Release y su etiqueta) y vuelve a correr."
            exit 1
          fi
          # Borradores sobrantes de intentos anteriores con esta versión: fuera.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          # Se crea UN borrador antes de subir: si lo crea electron-builder, sube los
          # archivos en paralelo y a veces arma dos borradores con la misma versión.
          gh release create "$VERSION" --draft --title "$VERSION" --target "$GITHUB_SHA" \
            --notes "SharkTracker para Windows $VERSION. Descarga: https://sharktracker.lol/descargar.html"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      # Ayudante de audio de los clips (app/nativo): se compila aquí con Visual Studio
      # y electron-builder lo copia a resources/ del instalador.
      - name: Compilar el ayudante de audio (sharkaudio.exe)
        shell: cmd
        run: nativo\compilar.cmd
      - name: Armar el instalador y subirlo a un Release en borrador
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar el Release
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Sin latest.yml las apps instaladas no encuentran la actualización.
          for f in latest.yml SharkTracker-Setup.exe SharkTracker-Setup.exe.blockmap; do
            gh release view "$VERSION" --json assets -q '.assets[].name' | grep -qx "$f" \
              || { echo "::error::Al Release $VERSION le falta $f"; exit 1; }
          done
          gh release edit "$VERSION" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
