# Publica una versión nueva de la app de escritorio (SharkTracker para Windows).
#
# Cómo se usa: pestaña "Actions" del repo → "App: publicar versión" → "Run workflow".
# Toma la versión de app/package.json, arma el instalador en una máquina Windows
# de GitHub y lo sube como Release "vX.Y.Z". Las apps instaladas lo detectan y se
# actualizan solas. (No toca la web: GitHub Pages sigue igual.)
#
# En dos pasos: electron-builder sube todo a un Release en BORRADOR (GitHub no deja
# crear uno ya publicado si la etiqueta vX.Y.Z todavía no existe) y después se publica
# el borrador, lo que crea la etiqueta en el commit que se armó.
name: "App: publicar versión"

on:
  workflow_dispatch:

permissions:
  contents: write   # para crear el Release y subir el instalador

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Revisar que la versión sea nueva
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::Ya existe el Release $VERSION publicado. Sube \"version\" en app/package.json (o borra ese Release y su etiqueta) y vuelve a correr."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Armar el instalador y subirlo a un Release en borrador
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar el Release
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Sin latest.yml las apps instaladas no encuentran la actualización.
          for f in latest.yml SharkTracker-Setup.exe; do
            gh release view "$VERSION" --json assets -q '.assets[].name' | grep -qx "$f" \
              || { echo "::error::Al Release $VERSION le falta $f"; exit 1; }
          done
          gh release edit "$VERSION" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
